services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ainterviewer
      POSTGRES_PASSWORD: ainterviewer
      POSTGRES_DB: ainterviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainterviewer -d ainterviewer"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Resume upload (backend/app/services/storage.py) needs a real S3-compatible store even
    # in the lightweight dev baseline — it's a real feature now, not experimental, and
    # shouldn't only work under the heavy full deploy (infra/docker-compose.yml +
    # live-agent). Found the hard way: interview creation hung ~20s then 500'd because
    # `S3_ENDPOINT_URL` pointed at a "minio" host that didn't exist in this stack.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ainterviewer
      MINIO_ROOT_PASSWORD: ainterviewer123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    command: ["/bin/sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://ainterviewer:ainterviewer@postgres:5432/ainterviewer
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      # Claude Agent SDK (vacancy_llm_service.py) запускает `claude` CLI подпроцессом
      # (см. backend/Dockerfile) — креды подписки (`claude login`, разово на хосте, НЕ в
      # образе) читает отсюда. Тот же паттерн, что live-agent/docker-compose.yml.
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/root/.claude:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      target: dev
    # `frontend-node-modules` is a persistent named volume (kept across restarts so a plain
    # `up` doesn't reinstall every time) — but that means it still holds whatever was
    # installed the FIRST time it was created, even after `--build` refreshes the image with
    # a newer package-lock.json (a volume mount masks the image's freshly-`npm ci`'d
    # node_modules at runtime, it doesn't merge with it). Found in production the hard way:
    # deploy-dev.yml reported success (it only health-checks the backend), but the live
    # frontend 500'd on every page with "Module not found: Can't resolve
    # '@phosphor-icons/react'" after a dependency was added — the volume from a deploy before
    # that dependency existed was still mounted. `npm ci` on every container start keeps the
    # volume in sync with package-lock.json (fast no-op when nothing changed).
    command: ["/bin/sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
  frontend-next:
