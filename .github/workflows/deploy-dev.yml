name: deploy dev baseline (self-hosted)

# Поднимает frontend+backend (docker-compose.dev.yml) на self-hosted раннере (Radmin VPN,
# 26.67.31.6) — тот же baseline, что и для локальной разработки (см. корневой README.md),
# только постоянно запущенный на выделенной машине и доступный по Radmin-сети.
#
# CORS_ORIGINS/NEXT_PUBLIC_BACKEND_URL зашиты явно (не секреты — просто конфиг, IP машины
# не чувствительная информация) — поменять оба значения здесь, если IP раннера изменится.
#
# shell: powershell (Windows PowerShell 5.1) — гарантированно есть на любой Windows-машине,
# в отличие от bash, который на self-hosted Windows-раннере может быть не в PATH службы.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.dev.yml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Write backend/.env
        # backend/app/config.py requires all of these (no defaults) — without them
        # Settings() raises ValidationError at import and the container won't even start.
        # postgres and minio ARE real, running services in this baseline as of
        # docker-compose.dev.yml's `minio` service + its `environment:` overrides on
        # `backend` (POSTGRES_HOST/DATABASE_URL/S3_ENDPOINT_URL) — the
        # "not-running-in-this-baseline" placeholders below for those get overridden by
        # compose and are effectively dead text, kept only so `.env` alone still passes
        # Settings() validation if someone runs the container without compose. redis is
        # genuinely NOT running in this baseline — the WS control-channel/live-event path
        # (interview_ws.py) still won't work here, only under deploy-full.yml's infra.
        run: |
          Set-Content -Path backend/.env -Encoding utf8 -Value @'
          CORS_ORIGINS=["http://localhost:3000","http://26.67.31.6:3000"]
          APP_ENV=development
          APP_DEBUG=true
          APP_HOST=0.0.0.0
          APP_PORT=8000
          SECRET_KEY=dev-secret-change-me
          POSTGRES_DB=ainterviewer
          POSTGRES_HOST=not-running-in-this-baseline
          POSTGRES_USER=ainterviewer
          POSTGRES_PASSWORD=ainterviewer
          DATABASE_URL=postgresql+asyncpg://ainterviewer:ainterviewer@not-running-in-this-baseline:5432/ainterviewer
          REDIS_HOST=not-running-in-this-baseline
          REDIS_PORT=6379
          REDIS_URL=redis://not-running-in-this-baseline:6379/0
          CELERY_BROKER_URL=redis://not-running-in-this-baseline:6379/1
          CELERY_RESULT_BACKEND=redis://not-running-in-this-baseline:6379/2
          MINIO_ROOT_USER=ainterviewer
          MINIO_ROOT_PASSWORD=ainterviewer123
          MINIO_BUCKET=ainterviewer-resumes
          S3_ENDPOINT_URL=http://not-running-in-this-baseline:9000
          S3_PUBLIC_ENDPOINT_URL=http://26.67.31.6:9000
          S3_ACCESS_KEY=ainterviewer
          S3_SECRET_KEY=ainterviewer123
          S3_BUCKET=ainterviewer-resumes
          S3_REGION=us-east-1
          PUBLIC_FRONTEND_URL=http://26.67.31.6:3000
          '@

      - name: Write frontend/.env
        run: |
          Set-Content -Path frontend/.env -Encoding utf8 -Value @'
          NEXT_PUBLIC_BACKEND_URL=http://26.67.31.6:8000
          BACKEND_INTERNAL_URL=http://backend:8000
          NEXT_DEV_ALLOWED_ORIGINS=26.67.31.6
          '@

      - name: Build and (re)start dev baseline
        # `up -d` itself can fail here (nonzero exit) when a depends_on:
        # condition: service_healthy dependency (backend) exits before ever
        # becoming healthy — before this workflow ever reaches "Wait for
        # backend health" below, which is the only step that dumps container
        # logs on failure. Dump logs here too so a crash-on-startup is
        # diagnosable from the Actions log alone.
        run: |
          docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            Write-Output "--- docker compose up failed, dumping minio + backend logs ---"
            docker compose -f docker-compose.dev.yml logs minio --tail 100
            docker compose -f docker-compose.dev.yml logs backend --tail 200
            exit $LASTEXITCODE
          }

      - name: Wait for backend health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8000/api/health -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) {
            # Write-Error is a TERMINATING error for this runner's PowerShell steps —
            # it aborts the script immediately, so the docker logs line below never ran
            # (found the hard way debugging the vacancy-interview-flow deploy). Write-Output
            # instead so the diagnostic actually prints before the explicit exit 1.
            Write-Output "ERROR: backend did not become healthy in time"
            docker compose -f docker-compose.dev.yml logs backend --tail 100
            exit 1
          }
          Write-Output "backend healthy"

      - name: Wait for frontend health
        # Backend-only health checking let a broken frontend report "success" here before:
        # `npm ci` (re)installing on every container start (docker-compose.dev.yml) plus a
        # Next.js dev compile takes longer than the backend, so give it a bigger budget.
        # A page that fails to compile (e.g. an unresolved import) serves HTTP 500, so a
        # plain status-code check on a real route is enough to catch it.
        run: |
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:3000/login -UseBasicParsing -TimeoutSec 5 | Out-Null
              $ok = $true
              break
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) {
            Write-Output "ERROR: frontend did not become healthy in time"
            docker compose -f docker-compose.dev.yml logs frontend --tail 200
            exit 1
          }
          Write-Output "frontend healthy"

      - name: Print URLs
        run: |
          Write-Output "frontend: http://26.67.31.6:3000"
          Write-Output "backend health: http://26.67.31.6:8000/api/health"
