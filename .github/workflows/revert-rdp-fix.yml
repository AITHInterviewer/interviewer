name: revert RDP fix (self-hosted)

# Undoes fix-rdp.yml: re-enables mandatory NLA, restores default Radmin VPN MTU, and
# removes the scoped firewall rule (falling back to Windows' built-in Remote Desktop
# rules). Run this once hidemy.name VPN is no longer needed, to restore RDP's normal
# security posture.

on:
  workflow_dispatch: {}

jobs:
  revert:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Re-enable mandatory NLA
        run: |
          $tsSetting = Get-WmiObject -Class Win32_TSGeneralSetting -Namespace root\cimv2\terminalservices -Filter "TerminalName='RDP-tcp'"
          $tsSetting.SetUserAuthenticationRequired(1) | Out-Null
          (Get-WmiObject -Class Win32_TSGeneralSetting -Namespace root\cimv2\terminalservices -Filter "TerminalName='RDP-tcp'").UserAuthenticationRequired

      - name: Restore default Radmin VPN adapter MTU
        run: |
          netsh interface ipv4 set subinterface "Radmin VPN" mtu=1500 store=persistent
          netsh interface ipv4 show subinterfaces

      - name: Remove the scoped RDP firewall rule
        run: |
          $name = "RDP-3389-any-profile-fix"
          $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-NetFirewallRule -DisplayName $name
            Write-Output "removed: $name"
          } else {
            Write-Output "already absent: $name"
          }

      - name: Report current state
        run: |
          Get-NetConnectionProfile | Format-Table InterfaceAlias, NetworkCategory, IPv4Connectivity
          Get-NetFirewallRule | Where-Object { $_.DisplayName -match 'Desktop' } | Format-Table DisplayName, Enabled, Direction, Action, Profile
