name: check claude auth (self-hosted)

# Проверяет, завершён ли claude login под учёткой раннера (bdtss) — если да, hidemy.name
# больше не обязателен постоянно включённым только ради логина (сессия/токен сохраняются
# локально), и можно отключить VPN, чтобы вернуть RDP.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Look for Claude credentials/config
        run: |
          $paths = @(
            "$env:USERPROFILE\.claude\.credentials.json",
            "$env:USERPROFILE\.claude.json",
            "$env:USERPROFILE\.config\claude\config.json"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Output "found: $p"
              Get-Item $p | Format-List FullName, LastWriteTime, Length
            } else {
              Write-Output "not found: $p"
            }
          }

      - name: claude --version / whoami-ish check
        run: |
          try {
            claude --version
          } catch {
            Write-Output "claude CLI not on PATH or not runnable: $_"
          }
