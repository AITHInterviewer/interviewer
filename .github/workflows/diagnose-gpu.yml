name: diagnose GPU availability (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: nvidia-smi on host
        run: |
          try {
            nvidia-smi
          } catch {
            Write-Output "nvidia-smi not found or failed: $_"
          }

      - name: Docker GPU support
        run: |
          docker info 2>&1 | Select-String -Pattern "runtime|nvidia" -SimpleMatch
          Write-Output "--- test container with --gpus all ---"
          docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
