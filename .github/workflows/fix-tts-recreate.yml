name: fix tts recreate (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Force-recreate tts container (picks up current env, e.g. HF_HUB_DISABLE_XET)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml up -d --force-recreate tts

      - name: Wait for tts health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:3906/v1/models" -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          Write-Output "tts healthy: $ok"

      - name: Retry TTS synth call
        run: |
          try {
            $body = @{ model = "speaches-ai/piper-ru_RU-irina-medium"; voice = "irina"; input = "Привет, это проверка"; response_format = "mp3" } | ConvertTo-Json
            $r = Invoke-WebRequest -Uri "http://localhost:3906/v1/audio/speech" -Method Post -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 60
            Write-Output "TTS synth OK: $($r.StatusCode), bytes=$($r.RawContentLength)"
          } catch {
            Write-Output "TTS synth FAILED: $($_.Exception.Message)"
          }

      - name: tts logs
        if: always()
        run: docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 80
