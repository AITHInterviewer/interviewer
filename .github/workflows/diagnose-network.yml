name: diagnose network (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Network adapters status
        run: Get-NetAdapter | Where-Object { $_.Name -match "hidemy|Radmin" } | Format-Table Name, InterfaceDescription, Status

      - name: Try reaching the CDN host directly from the runner host (not container)
        run: |
          try {
            $r = Invoke-WebRequest -Uri "https://us.aws.cdn.hf.co" -TimeoutSec 10 -UseBasicParsing -ErrorAction Stop
            Write-Output "OK: $($r.StatusCode)"
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }
