name: diagnose network (self-hosted)

# Разовая диагностика: смотрит таблицу маршрутов и сетевые адаптеры на раннере, чтобы
# понять, как уживаются Radmin VPN и другой VPN-клиент (Hide My Name), включённые
# одновременно — в частности, почему RDP на эту машину перестаёт работать при включении
# второго VPN (типичная причина: kill-switch второго VPN или ассиметричная маршрутизация
# после того как он подменяет default route).

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Network adapters
        run: Get-NetIPConfiguration | Format-List InterfaceAlias, InterfaceDescription, IPv4Address, IPv4DefaultGateway

      - name: Routing table
        run: route print -4

      - name: Interface metrics
        run: Get-NetIPInterface -AddressFamily IPv4 | Sort-Object InterfaceMetric | Format-Table ifIndex, InterfaceAlias, InterfaceMetric, ConnectionState

      - name: Network connection profiles (Public/Private/Domain per adapter)
        # A VPN can cause Windows to reclassify an adapter's network category — if RDP's
        # built-in firewall rules only allow Private/Domain and the adapter gets tagged
        # Public, RDP silently stops accepting connections on it. Locale-independent check.
        run: Get-NetConnectionProfile | Format-Table InterfaceAlias, NetworkCategory, IPv4Connectivity

      - name: RDP service and firewall rule status
        # -DisplayGroup with the English name doesn't match on a non-English Windows
        # locale (this machine is RU) — filter by DisplayName content instead, which is
        # also localized but consistently contains "Desktop" in the underlying rule name.
        run: |
          Get-Service TermService | Format-List Name, Status, StartType
          Get-NetFirewallRule | Where-Object { $_.DisplayName -match 'Desktop' -or $_.Name -match 'RemoteDesktop' } | Format-Table DisplayName, Enabled, Direction, Action, Profile
