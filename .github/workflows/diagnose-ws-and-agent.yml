name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: try downloading the same HF model file directly from the runner host (not container)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -Uri "https://huggingface.co/speaches-ai/piper-ru_RU-irina-medium/resolve/main/model.onnx" `
              -OutFile "$env:TEMP\model.onnx" -TimeoutSec 120
            $sw.Stop()
            $size = (Get-Item "$env:TEMP\model.onnx").Length
            Write-Output "OK: downloaded $size bytes in $($sw.Elapsed)"
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }
