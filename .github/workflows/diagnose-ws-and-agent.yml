name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check claude CLI works inside live-agent container
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q live-agent
          docker exec $containerId claude --version
          Write-Output "--- simple prompt test (30s timeout) ---"
          $job = Start-Job -ScriptBlock {
            param($cid)
            docker exec $cid claude -p "Say OK" --output-format text
          } -ArgumentList $containerId
          if (Wait-Job $job -Timeout 30) {
            Receive-Job $job
          } else {
            Write-Output "TIMED OUT after 30s"
            Stop-Job $job
          }
          Remove-Job $job -Force
