name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: write tts probe scripts
        run: |
          Set-Content -Path probe_download.py -Encoding utf8 -Value @'
          import json, urllib.request, urllib.error
          model_id = "speaches-ai/piper-ru_RU-irina-medium"
          req = urllib.request.Request(
              f"http://tts:8000/v1/models/{model_id}",
              method="POST",
          )
          try:
              r = urllib.request.urlopen(req, timeout=120)
              print("STATUS", r.status)
              print(r.read()[:2000])
          except urllib.error.HTTPError as e:
              print("STATUS", e.code)
              print(e.read().decode("utf-8", "replace"))
          '@
          Set-Content -Path probe_models.py -Encoding utf8 -Value @'
          import urllib.request
          r = urllib.request.urlopen("http://tts:8000/v1/models", timeout=10)
          print(r.read().decode("utf-8", "replace")[:4000])
          '@

      - name: trigger model download
        run: |
          Get-Content probe_download.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -

      - name: list available models/voices after download
        if: always()
        run: |
          Get-Content probe_models.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -

      - name: tts logs after download attempt
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 60
