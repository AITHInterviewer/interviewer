name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: show context around the self.llm is None checks
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q live-agent
          docker exec $containerId sh -c "sed -n '1600,1650p' /usr/local/lib/python3.11/site-packages/livekit/agents/voice/agent_activity.py"
          Write-Output "--- second location ---"
          docker exec $containerId sh -c "sed -n '2600,2650p' /usr/local/lib/python3.11/site-packages/livekit/agents/voice/agent_activity.py"
