name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent logs (full, no tail limit)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs live-agent

      - name: tts logs
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 200

      - name: stt logs
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs stt --tail 100
