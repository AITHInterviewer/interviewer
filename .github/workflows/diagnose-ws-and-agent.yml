name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check claude CLI prompt directly (no job wrapper)
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q live-agent
          docker exec $containerId claude -p "Say OK" --output-format text
          Write-Output "exit code: $LASTEXITCODE"
