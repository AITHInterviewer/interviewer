name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: live-agent logs (full)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs live-agent

      - name: livekit-server logs (tail)
        if: always()
        run: |
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs livekit-server --tail 100

      - name: tts logs (tail)
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 60
