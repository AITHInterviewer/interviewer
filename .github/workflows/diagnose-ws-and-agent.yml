name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: list all downloadable piper ru voices via speaches registry
        run: |
          Get-Content live-agent\probe_registry.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -

      - name: list files in the model repo on HF (find the actual small metadata file name)
        if: always()
        run: |
          try {
            $r = Invoke-WebRequest -Uri "https://huggingface.co/api/models/speaches-ai/piper-ru_RU-irina-medium" -TimeoutSec 30
            Write-Output $r.Content
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }
