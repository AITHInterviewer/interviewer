name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: list all downloadable piper ru voices via speaches registry
        run: |
          Get-Content live-agent\probe_registry.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -

      - name: test download of a small known HF file to see if size matters
        if: always()
        run: |
          Remove-Item "$env:TEMP\small.bin" -ErrorAction SilentlyContinue
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -Uri "https://huggingface.co/speaches-ai/piper-ru_RU-irina-medium/resolve/main/voices.json" `
              -OutFile "$env:TEMP\small.bin" -TimeoutSec 60
            $sw.Stop()
            $size = (Get-Item "$env:TEMP\small.bin").Length
            Write-Output "SMALL FILE OK: $size bytes in $($sw.Elapsed)"
          } catch {
            Write-Output "SMALL FILE FAILED: $($_.Exception.Message)"
          }
