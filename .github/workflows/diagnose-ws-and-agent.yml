name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check adapter status and re-enable anything disabled
        run: |
          Get-NetAdapter | Format-Table Name, InterfaceDescription, Status, ifIndex -AutoSize
          foreach ($n in @("Radmin VPN", "Tailscale")) {
            $a = Get-NetAdapter -Name $n -ErrorAction SilentlyContinue
            if ($a -and $a.Status -ne "Up") {
              Write-Output "Re-enabling $n (was $($a.Status))"
              Enable-NetAdapter -Name $n -Confirm:$false
            } else {
              Write-Output "$n status: $($a.Status)"
            }
          }
          Write-Output "--- looking for hidemy-related adapters by any name ---"
          Get-NetAdapter | Where-Object { $_.InterfaceDescription -like "*WireGuard*" -or $_.Name -like "*hidemy*" } | Format-Table Name, InterfaceDescription, Status -AutoSize
