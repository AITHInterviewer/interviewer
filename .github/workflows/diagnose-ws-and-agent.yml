name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: tts logs (traceback for the 500)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 80
