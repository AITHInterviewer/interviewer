name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: livekit-server logs (full, no tail limit)
        run: |
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs livekit-server
