name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: inspect ChatContext attributes
        run: |
          Set-Content -Path probe_ctx.py -Encoding utf8 -Value @'
          import inspect
          from livekit.agents.llm import ChatContext

          print("--- ChatContext members ---")
          for name in dir(ChatContext):
              if not name.startswith("_"):
                  print(name)
          print("--- items property ---")
          try:
              print(inspect.getsource(ChatContext.items.fget))
          except Exception as e:
              print("no items property:", e)
          '@
          Get-Content probe_ctx.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -
