name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: dump the event log jsonl for the latest interview
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q live-agent
          docker exec $containerId sh -c "ls -t /app/out/*.jsonl | head -1 | xargs cat"
