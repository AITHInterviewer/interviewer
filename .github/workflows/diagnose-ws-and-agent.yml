name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: list what's actually cached for stt models
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q stt
          docker exec $containerId find /root/.cache/huggingface/hub -maxdepth 1 -type d
          Write-Output "--- medium snapshot contents ---"
          docker exec $containerId sh -c "find /root/.cache/huggingface/hub/models--Systran--faster-whisper-medium -type f -o -type l 2>/dev/null | xargs -I{} ls -la {}"
          Write-Output "--- small snapshot contents (if any) ---"
          docker exec $containerId sh -c "find /root/.cache/huggingface/hub/models--Systran--faster-whisper-small -type f -o -type l 2>/dev/null | xargs -I{} ls -la {}"
