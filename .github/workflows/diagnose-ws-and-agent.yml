name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent logs (full)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs live-agent

      - name: stt logs (tail)
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs stt --tail 60

      - name: livekit-server logs (full)
        if: always()
        run: |
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs livekit-server
