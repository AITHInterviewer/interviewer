name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: inspect RoomInputOptions and RoomIO defaults
        run: |
          Set-Content -Path probe_roomio.py -Encoding utf8 -Value @'
          import inspect
          from livekit.agents.voice import room_io
          print("--- RoomInputOptions ---")
          print(inspect.signature(room_io.RoomInputOptions.__init__))
          print(room_io.RoomInputOptions.__doc__)
          print("--- RoomOutputOptions ---")
          print(inspect.signature(room_io.RoomOutputOptions.__init__))
          print(room_io.RoomOutputOptions.__doc__)
          '@
          Get-Content probe_roomio.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -
