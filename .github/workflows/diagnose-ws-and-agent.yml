name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: write tts probe script
        run: |
          Set-Content -Path probe_speech2.py -Encoding utf8 -Value @'
          import json, urllib.request, urllib.error
          body = json.dumps({"model": "speaches-ai/piper-ru_RU-irina-medium", "voice": "irina", "input": "privet, eto test"}).encode()
          req = urllib.request.Request("http://tts:8000/v1/audio/speech", data=body, headers={"Content-Type": "application/json"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              data = r.read()
              print("STATUS", r.status, "BYTES", len(data))
          except urllib.error.HTTPError as e:
              print("STATUS", e.code)
              print(e.read().decode("utf-8", "replace"))
          '@

      - name: actually synthesize speech now that the model is installed
        run: |
          Get-Content probe_speech2.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -
