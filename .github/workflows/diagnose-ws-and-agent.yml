name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check stt container env and uptime
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps stt
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q stt
          docker inspect $containerId --format "{{.State.StartedAt}}"
          docker inspect $containerId --format "{{range .Config.Env}}{{println .}}{{end}}" | Select-String "HF_HUB"

      - name: stt logs (full traceback for the 500)
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs stt --tail 150
