name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: list stt hub cache dirs
        run: |
          $containerId = docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -q stt
          docker exec $containerId find /root/.cache/huggingface/hub -maxdepth 3
