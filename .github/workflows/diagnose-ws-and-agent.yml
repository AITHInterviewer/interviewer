name: diagnose ws close + agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: inspect AgentSession.start signature and docstring
        run: |
          Set-Content -Path probe_sig.py -Encoding utf8 -Value @'
          import inspect
          from livekit.agents import AgentSession
          print(inspect.signature(AgentSession.start))
          print("---docstring---")
          print(AgentSession.start.__doc__)
          '@
          Get-Content probe_sig.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 -
