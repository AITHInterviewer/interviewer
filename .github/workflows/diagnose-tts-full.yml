name: diagnose tts full (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: TTS full logs (no tail limit)
        run: docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts
