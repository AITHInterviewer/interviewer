name: inspect hidemy.name config (self-hosted)

# Looks for hidemy.name VPN's install/config directories and any split-tunneling option
# in its settings, to find a proper (app-level) fix for it needing to stay on
# permanently for live-agent's Anthropic API calls while not breaking RDP over Radmin.

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Find hidemy.name install and config dirs
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\hidemy.name VPN",
            "$env:APPDATA\hidemy.name VPN",
            "$env:PROGRAMFILES\hidemy.name VPN",
            "${env:PROGRAMFILES(X86)}\hidemy.name VPN"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Output "=== $c ==="
              Get-ChildItem -Recurse -File $c -ErrorAction SilentlyContinue | Select-Object -First 200 FullName
            } else {
              Write-Output "not found: $c"
            }
          }

      - name: Search for any config/settings/json/ini files mentioning split
        run: |
          $roots = @("$env:LOCALAPPDATA\hidemy.name VPN", "$env:APPDATA\hidemy.name VPN")
          foreach ($r in $roots) {
            if (Test-Path $r) {
              Get-ChildItem -Recurse -File $r -Include *.json,*.ini,*.conf,*.cfg,*.xml,*.yaml,*.yml -ErrorAction SilentlyContinue |
                Select-String -Pattern "split" -List -ErrorAction SilentlyContinue |
                Format-Table Path, LineNumber, Line
            }
          }

      - name: Look for a WireGuard-style config (AllowedIPs)
        run: |
          $roots = @("$env:LOCALAPPDATA\hidemy.name VPN", "$env:APPDATA\hidemy.name VPN", "$env:PROGRAMDATA")
          foreach ($r in $roots) {
            if (Test-Path $r) {
              Get-ChildItem -Recurse -File $r -Include *.conf,*.ini -ErrorAction SilentlyContinue |
                Select-String -Pattern "AllowedIPs" -ErrorAction SilentlyContinue |
                Format-Table Path, LineNumber, Line
            }
          }
