name: diagnose hydration (self-hosted)

# Разовая диагностика: почему React не гидрируется через http://26.67.31.6:3000, но
# локально (без Docker, на другой машине) — гидрируется мгновенно. Сравнивает
# сырой HTTP-ответ на loopback (изнутри контейнера/раннера) и через внешний IP.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Headers via localhost (host loopback -> container port mapping)
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3000/interview/does-not-matter" -UseBasicParsing -TimeoutSec 10
            Write-Output "STATUS: $($r.StatusCode)"
            Write-Output "HEADERS:"
            $r.Headers | Format-Table -AutoSize | Out-String | Write-Output
            Write-Output "BODY LENGTH: $($r.RawContentLength)"
            Write-Output "BODY TAIL:"
            $r.Content.Substring([Math]::Max(0, $r.Content.Length - 800))
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }

      - name: Headers via 26.67.31.6 (external IP, same machine)
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://26.67.31.6:3000/interview/does-not-matter" -UseBasicParsing -TimeoutSec 10
            Write-Output "STATUS: $($r.StatusCode)"
            Write-Output "HEADERS:"
            $r.Headers | Format-Table -AutoSize | Out-String | Write-Output
            Write-Output "BODY LENGTH: $($r.RawContentLength)"
            Write-Output "BODY TAIL:"
            $r.Content.Substring([Math]::Max(0, $r.Content.Length - 800))
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }

      - name: Docker network mode / port publish detail
        run: |
          docker ps --filter "name=frontend" --format "{{.Names}}: {{.Ports}}"
          docker inspect --format "{{json .NetworkSettings.Ports}}" $(docker ps -q --filter "name=frontend")
