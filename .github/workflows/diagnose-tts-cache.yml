name: diagnose TTS cache layout (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: whoami + HF cache layout inside tts container
        run: |
          docker exec live-agent-tts-1 whoami
          docker exec live-agent-tts-1 sh -c "echo HOME=\$HOME"
          Write-Output "--- hub dir tree ---"
          docker exec live-agent-tts-1 find /root/.cache/huggingface/hub /home/*/.cache/huggingface/hub -maxdepth 4 2>&1
