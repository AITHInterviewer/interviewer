name: fix RDP access (self-hosted)

# Explicit fix for RDP breaking after a second VPN (hidemy.name) is enabled alongside
# Radmin VPN. Most likely cause: Windows reclassifies an adapter's network category to
# Public when a VPN comes up, and the built-in "Remote Desktop" firewall rules are scoped
# to Private/Domain only by default — so RDP silently stops accepting connections on that
# adapter. Fix: add an explicit inbound rule for TCP 3389 with Profile Any, independent of
# network category detection, plus ensure the RDP service itself is running.

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Ensure Remote Desktop service is running
        run: |
          Set-Service -Name TermService -StartupType Automatic
          if ((Get-Service TermService).Status -ne 'Running') {
            Start-Service TermService
          }
          Get-Service TermService | Format-List Name, Status, StartType

      - name: Ensure RDP is enabled at the OS level
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections'

      - name: Add firewall rule for RDP on ALL profiles (bypasses network-category issue)
        run: |
          $name = "RDP-3389-any-profile-fix"
          $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-NetFirewallRule -DisplayName $name
          }
          New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          Get-NetFirewallRule -DisplayName $name | Format-Table DisplayName, Enabled, Direction, Action, Profile

      - name: Report current network categories (informational)
        run: Get-NetConnectionProfile | Format-Table InterfaceAlias, NetworkCategory, IPv4Connectivity

      - name: Confirm 3389 is listening
        run: |
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort, State
