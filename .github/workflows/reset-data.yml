name: reset data (self-hosted)

# Разовая ручная джоба — полностью сносит postgres/minio (и заодно frontend
# node_modules/.next, чтобы не тащить кэш) volumes для основного стека
# (docker-compose.dev.yml + infra/docker-compose.yml). Живой стек не остаётся
# запущенным после этого — следующий деплой (deploy-dev.yml / deploy-full.yml /
# seed-demo-interview.yml) поднимет всё заново с чистой БД и пустым MinIO.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-full
  cancel-in-progress: false

jobs:
  reset:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Stop stack and remove postgres/minio (+ frontend cache) volumes
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            down -v --remove-orphans

      - name: Report remaining volumes
        if: always()
        run: docker volume ls
