name: diagnose rdp/vpn (self-hosted, temporary)

# Разовая диагностика: раннер числится online в GitHub Actions (значит агент и интернет
# у него в порядке), но с этой машиной пропали RDP и пинг по Radmin VPN. Смотрим, что видно
# изнутри самой машины — статус Radmin VPN, RDP-службы, сетевые интерфейсы. Удалить после
# использования (см. AGENTS.md/.github/workflows — держим только deploy-full.yml + CI).

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: RDP (Remote Desktop) service and firewall
        run: |
          Get-Service -Name TermService | Format-List *
          Write-Output "--- RDP firewall rules ---"
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Select-Object DisplayName, Enabled, Direction, Action
          Write-Output "--- fDenyTSConnections (0 = RDP allowed) ---"
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections

      - name: Radmin VPN process and service
        run: |
          Write-Output "--- Radmin VPN processes ---"
          Get-Process | Where-Object { $_.ProcessName -like "*radmin*" -or $_.ProcessName -like "*rvpn*" } | Format-Table Name, Id, Responding
          Write-Output "--- Radmin VPN services ---"
          Get-Service | Where-Object { $_.DisplayName -like "*radmin*" -or $_.Name -like "*rvpn*" } | Format-Table Name, DisplayName, Status

      - name: Network interfaces and IPs
        run: |
          Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceAlias, IPAddress, PrefixOrigin | Format-Table -AutoSize
          Write-Output "--- adapters ---"
          Get-NetAdapter | Format-Table Name, InterfaceDescription, Status, LinkSpeed
