name: diagnose tts body (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: TTS synth call, ASCII-only input, UTF-8 explicit
        run: |
          $payload = @{ model = "speaches-ai/piper-ru_RU-irina-medium"; voice = "irina"; input = "hello test"; response_format = "mp3" } | ConvertTo-Json
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3906/v1/audio/speech" -Method Post -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing -TimeoutSec 60
            Write-Output "OK: $($r.StatusCode), bytes=$($r.RawContentLength)"
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              $stream = $resp.GetResponseStream()
              $reader = New-Object System.IO.StreamReader($stream)
              $errBody = $reader.ReadToEnd()
              Write-Output "STATUS: $($resp.StatusCode.value__)"
              Write-Output "BODY: [$errBody]"
              Write-Output "HEADERS:"
              $resp.Headers | Format-Table -AutoSize | Out-String | Write-Output
            } else {
              Write-Output "NO RESPONSE: $($_.Exception.Message)"
            }
          }
