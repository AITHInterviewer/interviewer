name: diagnose tts body (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: TTS synth call with error body captured
        run: |
          $body = @{ model = "speaches-ai/piper-ru_RU-irina-medium"; voice = "irina"; input = "Привет, это проверка"; response_format = "mp3" } | ConvertTo-Json
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3906/v1/audio/speech" -Method Post -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 60
            Write-Output "OK: $($r.StatusCode), bytes=$($r.RawContentLength)"
          } catch {
            $resp = $_.Exception.Response
            if ($resp) {
              $stream = $resp.GetResponseStream()
              $reader = New-Object System.IO.StreamReader($stream)
              $errBody = $reader.ReadToEnd()
              Write-Output "STATUS: $($resp.StatusCode.value__)"
              Write-Output "BODY: $errBody"
            } else {
              Write-Output "NO RESPONSE: $($_.Exception.Message)"
            }
          }
