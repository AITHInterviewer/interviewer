name: diagnose claude cli (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check claude CLI presence and auth status
        run: |
          try {
            $v = claude --version
            Write-Output "claude CLI found: $v"
          } catch {
            Write-Output "claude CLI NOT found in PATH: $($_.Exception.Message)"
          }
          Write-Output "---"
          Write-Output "Current user: $env:USERNAME"
          Write-Output "Home: $env:USERPROFILE"
          Write-Output "---"
          $claudeDir = Join-Path $env:USERPROFILE ".claude"
          if (Test-Path $claudeDir) {
            Write-Output "Found $claudeDir :"
            Get-ChildItem $claudeDir -ErrorAction SilentlyContinue | Select-Object Name
          } else {
            Write-Output "$claudeDir does not exist"
          }
