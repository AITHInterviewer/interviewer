name: diagnose claude cli (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check claude CLI presence, version, and credential location
        run: |
          Write-Output "User: $env:USERNAME  Home: $env:USERPROFILE"
          Write-Output "---"
          try {
            $v = & claude --version 2>&1
            Write-Output "claude --version: $v"
          } catch {
            Write-Output "claude not runnable: $($_.Exception.Message)"
          }
          Write-Output "---"
          $candidates = @(
            (Join-Path $env:USERPROFILE ".claude"),
            (Join-Path $env:APPDATA "claude"),
            (Join-Path $env:LOCALAPPDATA "claude")
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Output "EXISTS: $c"
              Get-ChildItem $c -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Output
            } else {
              Write-Output "missing: $c"
            }
          }
