name: toggle hide.my.name VPN (self-hosted)

# Disables (or re-enables) the hidemy.name VPN network adapters at the OS level — the
# quickest reversible way to stop it interfering with Radmin VPN's own tunnel without
# needing to quit the GUI app. `action` input: "disable" (default) or "enable".

on:
  workflow_dispatch:
    inputs:
      action:
        description: "disable or enable"
        required: true
        default: "disable"

jobs:
  toggle:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Report matching services and processes (informational)
        run: |
          Get-Service | Where-Object { $_.DisplayName -match 'hide|wireguard|openvpn' -or $_.Name -match 'hide|wireguard|openvpn' } | Format-Table Name, DisplayName, Status
          Get-Process | Where-Object { $_.ProcessName -match 'hide|wireguard|openvpn' } | Format-Table ProcessName, Id

      - name: List hidemy.name-related network adapters
        run: Get-NetAdapter | Where-Object { $_.InterfaceDescription -match 'WireGuard|TAP-Windows' -or $_.Name -match 'hidemy' } | Format-Table Name, InterfaceDescription, Status

      - name: Disable hidemy.name adapters
        if: ${{ github.event.inputs.action == 'disable' }}
        run: |
          $adapters = Get-NetAdapter | Where-Object { $_.Name -match 'hidemy' }
          foreach ($a in $adapters) {
            Disable-NetAdapter -Name $a.Name -Confirm:$false
            Write-Output "disabled: $($a.Name)"
          }
          Get-NetAdapter | Where-Object { $_.Name -match 'hidemy' } | Format-Table Name, Status

      - name: Enable hidemy.name adapters
        if: ${{ github.event.inputs.action == 'enable' }}
        run: |
          $adapters = Get-NetAdapter | Where-Object { $_.Name -match 'hidemy' }
          foreach ($a in $adapters) {
            Enable-NetAdapter -Name $a.Name -Confirm:$false
            Write-Output "enabled: $($a.Name)"
          }
          Get-NetAdapter | Where-Object { $_.Name -match 'hidemy' } | Format-Table Name, Status

      - name: Report resulting routes/profiles
        if: always()
        run: |
          Get-NetConnectionProfile | Format-Table InterfaceAlias, NetworkCategory, IPv4Connectivity
          route print -4
