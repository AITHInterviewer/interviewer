name: seed demo interview (self-hosted)

# Разовая ручная джоба — не полагается на то, что deploy-full.yml уже поднял стек в ТОМ
# ЖЕ workspace (проверено на практике: backend/.env не был записан там, где ждал этот
# workflow, — контейнеры оказались подняты из другого места/вручную, с устаревшим
# frontend node_modules — livekit-client не резолвился). Поэтому сам пишет .env-файлы
# (тем же содержимым, что deploy-full.yml), поднимает postgres/redis/backend/frontend
# (--build — подхватит недавний фикс Dockerfile с scripts/+alembic.ini), переустанавливает
# frontend-зависимости (node_modules — именованный volume, `--build` его не обновляет) и
# только затем прогоняет миграцию и сид внутри backend-контейнера.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-full
  cancel-in-progress: false

jobs:
  seed:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Write backend/.env
        run: |
          Set-Content -Path backend/.env -Encoding utf8 -Value @'
          CORS_ORIGINS=["http://localhost:3000","http://26.67.31.6:3000"]
          APP_ENV=development
          APP_DEBUG=true
          APP_HOST=0.0.0.0
          APP_PORT=8000
          SECRET_KEY=dev-secret-change-me
          POSTGRES_DB=ainterviewer
          POSTGRES_HOST=postgres
          POSTGRES_USER=ainterviewer
          POSTGRES_PASSWORD=ainterviewer
          DATABASE_URL=postgresql+asyncpg://ainterviewer:ainterviewer@postgres:5432/ainterviewer
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/1
          CELERY_RESULT_BACKEND=redis://redis:6379/2
          MINIO_ROOT_USER=ainterviewer
          MINIO_ROOT_PASSWORD=ainterviewer123
          MINIO_BUCKET=ainterviewer-resumes
          S3_ENDPOINT_URL=http://minio:9000
          S3_PUBLIC_ENDPOINT_URL=http://26.67.31.6:3903
          S3_ACCESS_KEY=ainterviewer
          S3_SECRET_KEY=ainterviewer123
          S3_BUCKET=ainterviewer-resumes
          S3_REGION=us-east-1
          '@

      - name: Write frontend/.env
        run: |
          Set-Content -Path frontend/.env -Encoding utf8 -Value @'
          NEXT_PUBLIC_BACKEND_URL=http://26.67.31.6:8000
          BACKEND_INTERNAL_URL=http://backend:8000
          '@

      - name: Build and (re)start postgres + redis + backend + frontend
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            up -d --build `
            postgres redis backend frontend

      - name: Reinstall frontend deps (node_modules is a named volume, --build alone doesn't refresh it)
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T frontend npm install
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            restart frontend

      - name: Wait for backend health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Write-Error "backend did not become healthy in time"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs backend --tail 100
            exit 1
          }
          Write-Output "backend healthy"

      - name: Wait for frontend health
        # Проверяет только "/" (пустая стартовая страница, не тянет livekit-client) — Next
        # dev компилирует страницы по запросу, так что этот чек не гарантирует, что именно
        # /interview/[token] соберётся без ошибок после npm install. Минимальная проверка
        # "процесс жив", не полноценный e2e-гейт.
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:3000 -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Write-Error "frontend did not become healthy in time"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs frontend --tail 100
            exit 1
          }
          Write-Output "frontend healthy"

      - name: Run migration + seed script inside the backend container
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T backend uv run alembic upgrade head
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T backend uv run python -m scripts.seed_demo_interview
