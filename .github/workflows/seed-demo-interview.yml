name: seed demo interview (self-hosted)

# Разовая ручная джоба — не полагается на то, что deploy-full.yml уже поднял стек в ТОМ
# ЖЕ workspace (проверено на практике: backend/.env не был записан там, где ждал этот
# workflow, — контейнеры оказались подняты из другого места/вручную, с устаревшим
# frontend node_modules — livekit-client не резолвился). Поэтому сам пишет .env-файлы
# (тем же содержимым, что deploy-full.yml), поднимает postgres/redis/backend/frontend
# (--build — подхватит недавний фикс Dockerfile с scripts/+alembic.ini), переустанавливает
# frontend-зависимости (node_modules — именованный volume, `--build` его не обновляет) и
# только затем прогоняет миграцию и сид внутри backend-контейнера.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-full
  cancel-in-progress: false

jobs:
  seed:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Ensure firewall rules for livekit-server ports
        run: |
          $rules = @{
            "ainterviewer-3907" = @{ Port = 3907; Proto = "TCP" }
            "ainterviewer-3908" = @{ Port = 3908; Proto = "TCP" }
            "ainterviewer-livekit-udp" = @{ Port = "50000-50100"; Proto = "UDP" }
          }
          foreach ($name in $rules.Keys) {
            $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
            if (-not $existing) {
              New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol $rules[$name].Proto -LocalPort $rules[$name].Port -Action Allow | Out-Null
            }
          }

      - name: Write backend/.env
        # LIVEKIT_WS_URL — по умолчанию в коде "ws://localhost:3907" (см. app/config.py),
        # что для БРАУЗЕРА кандидата означает "его собственную машину", не раннер —
        # LiveKit-соединение падает с ERR_CONNECTION_REFUSED. Нужен внешний IP раннера.
        run: |
          Set-Content -Path backend/.env -Encoding utf8 -Value @'
          CORS_ORIGINS=["http://localhost:3000","http://26.67.31.6:3000"]
          APP_ENV=development
          APP_DEBUG=true
          APP_HOST=0.0.0.0
          APP_PORT=8000
          SECRET_KEY=dev-secret-change-me
          POSTGRES_DB=ainterviewer
          POSTGRES_HOST=postgres
          POSTGRES_USER=ainterviewer
          POSTGRES_PASSWORD=ainterviewer
          DATABASE_URL=postgresql+asyncpg://ainterviewer:ainterviewer@postgres:5432/ainterviewer
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/1
          CELERY_RESULT_BACKEND=redis://redis:6379/2
          MINIO_ROOT_USER=ainterviewer
          MINIO_ROOT_PASSWORD=ainterviewer123
          MINIO_BUCKET=ainterviewer-resumes
          S3_ENDPOINT_URL=http://minio:9000
          S3_PUBLIC_ENDPOINT_URL=http://26.67.31.6:3903
          S3_ACCESS_KEY=ainterviewer
          S3_SECRET_KEY=ainterviewer123
          S3_BUCKET=ainterviewer-resumes
          S3_REGION=us-east-1
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          LIVEKIT_WS_URL=ws://26.67.31.6:3907
          '@

      - name: Write frontend/.env
        # NEXT_DEV_ALLOWED_ORIGINS — Next.js dev-сервер по умолчанию блокирует
        # кросс-origin запросы к dev-ресурсам (HMR websocket и часть бутстрап-скриптов
        # гидратации); без этого доступ с любого хоста, кроме localhost, тихо не
        # гидрируется — ни одной ошибки в браузерной консоли, только в логах самого
        # контейнера ("Blocked cross-origin request to Next.js dev resource"). Найдено
        # на практике 2026-09-04, см. next.config.ts.
        run: |
          Set-Content -Path frontend/.env -Encoding utf8 -Value @'
          NEXT_PUBLIC_BACKEND_URL=http://26.67.31.6:8000
          BACKEND_INTERNAL_URL=http://backend:8000
          NEXT_DEV_ALLOWED_ORIGINS=26.67.31.6
          '@

      - name: Build and (re)start postgres + redis + backend + frontend + livekit-server
        # livekit-server: deploy-full.yml исключает его из-за конфликта фиксированного
        # UDP-диапазона 50000-50100 с портами, которые Docker Desktop/WSL2 на Windows
        # резервирует динамически (см. комментарий в том файле) — пробуем всё равно
        # здесь, читаем реальную ошибку, если она есть, вместо того чтобы гадать заранее.
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            up -d --build `
            postgres redis backend frontend livekit-server

      - name: Reinstall frontend deps and clear stale .next build cache
        # node_modules AND .next are named volumes (docker-compose.dev.yml) that survive
        # `--build`/container recreation — confirmed on this runner: after adding
        # livekit-client, the container kept serving a stale compiled .next bundle where
        # ConsentInfo's fetch effect silently never fired. `rm -rf .next` forces Next to
        # recompile from the current bind-mounted source (./frontend:/app) on restart.
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T frontend npm install
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T frontend rm -rf .next
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            restart frontend

      - name: Wait for backend health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Write-Error "backend did not become healthy in time"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs backend --tail 100
            exit 1
          }
          Write-Output "backend healthy"

      - name: Wait for frontend health
        # Проверяет только "/" (пустая стартовая страница, не тянет livekit-client) — Next
        # dev компилирует страницы по запросу, так что этот чек не гарантирует, что именно
        # /interview/[token] соберётся без ошибок после npm install. Минимальная проверка
        # "процесс жив", не полноценный e2e-гейт.
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:3000 -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Write-Error "frontend did not become healthy in time"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs frontend --tail 100
            exit 1
          }
          Write-Output "frontend healthy"

      - name: Write live-agent/.env
        # REDIS_URL/LIVEKIT_URL — через host.docker.internal, не имя сервиса: live-agent
        # это ОТДЕЛЬНЫЙ compose-проект/сеть от postgres+redis+livekit-server (см.
        # docker-compose.yml, комментарий deploy-full.yml про раздельные сети). claude
        # login НЕ делается здесь — разово на хосте, см. docker-compose.yml volume mount.
        run: |
          Set-Content -Path live-agent/.env -Encoding utf8 -Value @'
          LLM_MODEL=claude-haiku-4-5
          STT_API_KEY=not-needed
          TTS_API_KEY=not-needed
          STT_MODEL=whisper-1
          STT_LANGUAGE=ru
          TTS_MODEL=speaches-ai/piper-ru_RU-irina-medium
          TTS_VOICE=irina
          MOCK_INTERVIEW_PATH=mock_data/interview_example.json
          LIVEKIT_URL=ws://host.docker.internal:3907
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          REDIS_URL=redis://host.docker.internal:3902
          '@

      - name: Build and (re)start live-agent (+ its stt/tts)
        run: |
          $env:CLAUDE_CONFIG_DIR = "$env:USERPROFILE\.claude"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml up -d --build --remove-orphans

      - name: Report live-agent status
        if: always()
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs live-agent --tail 80

      - name: Report livekit-server status
        if: always()
        run: |
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml ps livekit-server
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs livekit-server --tail 50

      - name: Run migration + seed script inside the backend container
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T backend uv run alembic upgrade head
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            exec -T -e PUBLIC_FRONTEND_URL=http://26.67.31.6:3000 backend uv run python -m scripts.seed_demo_interview
