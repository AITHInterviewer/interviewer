name: deploy full stack (self-hosted)

# Единственный деплой-workflow в репо (deploy-dev.yml/seed-demo-interview.yml убраны —
# избыточны рядом с этим). Поднимает всё: общую инфру (postgres, redis, minio,
# livekit-server) + backend/frontend + nginx (единая точка входа, см.
# infra/nginx/nginx.conf) + live-agent (+ его self-hosted stt/tts). evaluation-agent
# намеренно НЕ включает сам воркер — worker.py падает на NotImplementedError (см.
# evaluation-agent/README.md, раздел «Статус»), это ожидаемо, не баг — поднимается только
# его STT (stt-accurate), самостоятельная часть.
#
# Три ОТДЕЛЬНЫХ `docker compose` вызова, не один со склейкой всех `-f` — при мульти-file
# compose относительные пути (env_file/build context/volumes) резолвятся относительно
# директории ПЕРВОГО `-f`-файла целиком для всех файлов разом, а не каждый относительно
# своей директории. infra/docker-compose.yml + docker-compose.dev.yml оба без относительных
# путей, кроме тех, что уже написаны относительно корня репо — их можно смешивать через
# `--project-directory .`. live-agent/ и evaluation-agent/ (compose-файлы коллег) написаны
# для запуска из СВОЕЙ директории (`build: .`, `env_file: .env`) — не трогаем их, а задаём
# `--project-directory` явно под каждый, оставаясь в cwd репозитория (без `cd`).
#
# livekit-egress сюда не включаю: у него единственный относительный путь
# (`./livekit-egress-config.yaml`) в infra/docker-compose.yml, а сервис и так помечен в
# infra/README.md как "ни разу не проверялся вживую" — не стоит того, чтобы усложнять
# резолюцию путей ради непроверенного сервиса.
#
# ВАЖНО про live-agent: LLM-часть требует `claude login` (Claude Agent SDK на подписке,
# см. live-agent/CLAUDE.md, п.8) — выполненного ПОД ТЕМ ЖЕ пользователем, из-под которого
# работает раннер (сейчас это bdtss). Это разовый интерактивный шаг (открывает браузер
# для логина), который эта джоба выполнить не может — до него граф диалога поднимется,
# но реальные LLM-вызовы будут падать с ошибкой авторизации.
#
# ВАЖНО про сети: infra+backend+frontend — один compose-проект (`--project-directory .`,
# имя "interviewer"), общая docker-сеть — backend сможет резолвить "postgres"/"redis"/
# "minio" по имени, когда реально начнёт их использовать. live-agent и evaluation-agent —
# отдельные проекты/сети (их файлы не трогаем) — если live-agent'у нужен livekit-server
# из infra, он достаёт его через `host.docker.internal` (Docker Desktop на Windows
# резолвит это в адрес хоста), не по имени сервиса.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-full
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Reserve livekit UDP port range from Windows dynamic allocation
        # livekit-server binds a FIXED UDP range (50000-50100, see infra/livekit.yaml)
        # for RTC media. Windows/WSL2 (Docker Desktop's backend) hands out ports from its
        # own dynamic/ephemeral range for unrelated outbound connections, and that range
        # can overlap 50000-50100 - livekit-server then fails to bind with "Only one usage
        # of each socket address...". `netsh ... excludedportrange` reserves the block so
        # Windows won't hand any of it out to anything else; idempotent (errors harmlessly
        # if already reserved) and, like the firewall rule below, may need elevation the
        # runner account doesn't have - warn and continue rather than abort the deploy,
        # since it's an environment fix, not something this workflow can guarantee.
        # netsh is a native exe, not a cmdlet - failures (access denied, already
        # reserved) come back as plain output + a non-zero exit code, not a catchable
        # PowerShell exception, so check $LASTEXITCODE rather than try/catch here. Actions'
        # powershell wrapper fails the STEP on a nonzero $LASTEXITCODE left over from the
        # last command it ran, regardless of our own warn-and-continue logic - reset it
        # explicitly, same as the network-create step below (hit this the hard way: the
        # warning printed correctly and the step still failed the whole run).
        run: |
          $output = netsh interface ipv4 add excludedportrange protocol=udp startport=50000 numberofports=101 store=persistent
          if ($LASTEXITCODE -eq 0) {
            Write-Output "reserved UDP 50000-50100 for livekit-server"
          } else {
            Write-Output "WARNING: could not reserve UDP 50000-50100 (netsh: $output) - livekit-server media may fail to bind; reserve it manually on the runner if so"
          }
          $global:LASTEXITCODE = 0

      - name: Ensure firewall rules for all service ports
        run: |
          # Ports 3901-3908 are this project's dedicated pool (see root README.md,
          # "Порты проекта") — picked specifically to avoid clashing with other
          # unrelated projects' default ports (postgres/redis/minio/etc.) on this
          # shared runner, the way react-agent-stt collided with our minio on 9000.
          $rules = @{
            "ainterviewer-3000" = @{ Port = 3000; Proto = "TCP" }
            "ainterviewer-8000" = @{ Port = 8000; Proto = "TCP" }
            # 12345, not the 39xx pool: matches the port already forwarded externally
            # (see infra/docker-compose.yml, nginx service) - keep in sync if that changes.
            "ainterviewer-nginx" = @{ Port = 12345; Proto = "TCP" }
            "ainterviewer-3901" = @{ Port = 3901; Proto = "TCP" } # postgres
            "ainterviewer-3902" = @{ Port = 3902; Proto = "TCP" } # redis
            "ainterviewer-3903" = @{ Port = 3903; Proto = "TCP" } # minio API
            "ainterviewer-3904" = @{ Port = 3904; Proto = "TCP" } # minio console
            "ainterviewer-3905" = @{ Port = 3905; Proto = "TCP" } # live-agent stt
            "ainterviewer-3906" = @{ Port = 3906; Proto = "TCP" } # live-agent tts
            "ainterviewer-3907" = @{ Port = 3907; Proto = "TCP" } # livekit signaling
            "ainterviewer-3908" = @{ Port = 3908; Proto = "TCP" } # livekit tcp fallback
            "ainterviewer-livekit-udp" = @{ Port = "50000-50100"; Proto = "UDP" }
          }
          foreach ($name in $rules.Keys) {
            $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
            if (-not $existing) {
              # Runner service account turned out to lack rights to create NEW rules
              # (existing ones were set up once, out-of-band, with elevation) - "Access
              # is denied" (Win32 error 5) here used to be a terminating error that
              # aborted the whole deploy over a single missing rule. Warn and continue
              # instead: whoever manages the runner needs to create it once manually,
              # same as the ones already in place.
              try {
                New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol $rules[$name].Proto -LocalPort $rules[$name].Port -Action Allow -ErrorAction Stop | Out-Null
                Write-Output "created: $name"
              } catch {
                Write-Output "WARNING: could not create firewall rule '$name' ($($_.Exception.Message)) - create it manually on the runner"
              }
            } else {
              Write-Output "already exists: $name"
            }
          }

      - name: Ensure shared Docker network between this stack and live-agent
        # ainterviewer-net — общая сеть между двумя отдельными compose-проектами (этот
        # стек и live-agent/docker-compose.yml), объявлена как external: true в обоих
        # compose-файлах (сам Compose её не создаёт). Идемпотентно: игнорируем ошибку,
        # если уже существует с прошлого запуска.
        run: |
          docker network create ainterviewer-net
          $global:LASTEXITCODE = 0
          Write-Output "ok"

      - name: Write backend/.env
        # backend/app/config.py requires all of these (no defaults) — without them
        # Settings() raises ValidationError at import and backend won't start. infra +
        # backend/frontend run as one compose project here, so postgres/redis/minio
        # resolve by these exact service names.
        run: |
          Set-Content -Path backend/.env -Encoding utf8 -Value @'
          CORS_ORIGINS=["http://localhost:3000","http://26.67.31.6:3000","http://26.67.31.6:12345","http://89.149.199.118:12345"]
          APP_ENV=development
          APP_DEBUG=true
          APP_HOST=0.0.0.0
          APP_PORT=8000
          SECRET_KEY=dev-secret-change-me
          POSTGRES_DB=ainterviewer
          POSTGRES_HOST=postgres
          POSTGRES_USER=ainterviewer
          POSTGRES_PASSWORD=ainterviewer
          DATABASE_URL=postgresql+asyncpg://ainterviewer:ainterviewer@postgres:5432/ainterviewer
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/1
          CELERY_RESULT_BACKEND=redis://redis:6379/2
          MINIO_ROOT_USER=ainterviewer
          MINIO_ROOT_PASSWORD=ainterviewer123
          MINIO_BUCKET=ainterviewer-resumes
          S3_ENDPOINT_URL=http://minio:9000
          S3_PUBLIC_ENDPOINT_URL=http://26.67.31.6:3903
          S3_ACCESS_KEY=ainterviewer
          S3_SECRET_KEY=ainterviewer123
          S3_BUCKET=ainterviewer-resumes
          S3_REGION=us-east-1
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          LIVEKIT_WS_URL=ws://26.67.31.6:12345
          PUBLIC_FRONTEND_URL=http://26.67.31.6:12345
          '@

      - name: Write frontend/.env
        run: |
          Set-Content -Path frontend/.env -Encoding utf8 -Value @'
          BACKEND_INTERNAL_URL=http://backend:8000
          NEXT_DEV_ALLOWED_ORIGINS=26.67.31.6,89.149.199.118
          '@

      - name: Write infra/livekit.yaml (with node_ip for this deploy)
        # rtc.node_ip — какой IP livekit-server объявляет ICE-кандидатам как адрес для
        # медиа. 26.67.31.6 — адрес этого раннера в Radmin VPN, тот же, через который
        # реально ходит браузер кандидата. use_external_ip (STUN) сюда не годится — STUN
        # находит РЕАЛЬНЫЙ публичный IP хоста через интернет-аплинк, а не VPN-адрес, и
        # это две разные сети (см. infra/livekit.yaml, комментарий в checked-in версии).
        run: |
          Set-Content -Path infra/livekit.yaml -Encoding utf8 -Value @'
          port: 7880
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            node_ip: 26.67.31.6
          keys:
            devkey: secret
          room:
            auto_create: true
          '@

      - name: Write live-agent/.env
        run: |
          Set-Content -Path live-agent/.env -Encoding utf8 -Value @'
          LLM_MODEL=claude-haiku-4-5
          STT_BASE_URL=http://stt:8000/v1
          TTS_BASE_URL=http://tts:8000/v1
          STT_API_KEY=not-needed
          TTS_API_KEY=not-needed
          STT_MODEL=whisper-1
          STT_LANGUAGE=ru
          TTS_MODEL=speaches-ai/piper-ru_RU-ruslan-medium
          TTS_VOICE=ruslan
          MOCK_INTERVIEW_PATH=mock_data/interview_example.json
          BACKEND_BASE_URL=http://backend:8000
          LIVE_AGENT_TOKEN=development-live-agent-token
          LIVEKIT_URL=ws://livekit-server:7880
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          '@

      - name: Build and (re)start infra + backend + frontend
        # livekit-server теперь тоже здесь — см. шаг "Reserve livekit UDP port range"
        # выше про обход конфликта его фиксированного UDP-диапазона с Windows/Docker
        # Desktop. livekit-egress по-прежнему не включаю: непроверенный вживую сервис
        # (см. infra/README.md), не стоит усложнять ради него резолюцию путей.
        # Explicit `down` before `up`, not `up --force-recreate`: force-recreate can start
        # the replacement container before Docker has fully released the old one's port
        # binding, producing "port is already allocated" (observed on minio:9000/tcp) —
        # `down` guarantees full teardown first, avoiding that race.
        run: |
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            down --remove-orphans
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            up -d --build `
            postgres redis minio livekit-server backend frontend nginx
          # livekit-server отдельно, с --force-recreate: он читает infra/livekit.yaml
          # через bind-mount — Compose не пересоздаёт контейнер только из-за того, что
          # ИЗМЕНИЛОСЬ СОДЕРЖИМОЕ файла на хосте (сама конфигурация сервиса в compose не
          # изменилась) — без этого контейнер продолжает работать со старым node_ip до
          # следующего изменения самого docker-compose.yml. Не форсим остальные сервисы —
          # незачем гонять их без нужды при каждом деплое.
          docker compose --project-directory . `
            -f docker-compose.dev.yml `
            -f infra/docker-compose.yml `
            up -d --force-recreate livekit-server

      - name: Build and (re)start live-agent (+ its stt/tts)
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml up -d --build --remove-orphans

      - name: Build and (re)start evaluation-agent's stt-accurate
        run: |
          docker compose --project-directory evaluation-agent -f evaluation-agent/docker-compose.yml up -d --build --remove-orphans stt-accurate

      - name: Wait for backend health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8000/api/health -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            # Write-Error is a TERMINATING error for this runner's PowerShell steps —
            # it aborts the script immediately, so the docker logs line below never ran
            # (found the hard way debugging the vacancy-interview-flow deploy). Write-Output
            # instead so the diagnostic actually prints before the explicit exit 1.
            Write-Output "ERROR: backend did not become healthy in time"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs backend --tail 100
            exit 1
          }
          Write-Output "backend healthy"

      - name: Wait for minio health
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:3903/minio/health/live -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Write-Output "ERROR: minio did not become healthy in time"
            exit 1
          }
          Write-Output "minio healthy"

      - name: Wait for livekit-server
        # No real health endpoint contract to rely on here (see infra/README.md - egress
        # side of this service is untested, and this port isn't exercised by any test in
        # the repo either) - a TCP connect on the signaling port is the best available
        # signal. Soft warning, not a hard failure: unlike backend/minio, this service is
        # known-fragile on this runner (UDP port range, see steps above) and shouldn't
        # take down an otherwise-successful deploy of everything else.
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            if ((Test-NetConnection -ComputerName localhost -Port 3907 -WarningAction SilentlyContinue).TcpTestSucceeded) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Output "WARNING: livekit-server did not come up in time - check logs, see UDP port range steps above"
            docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml logs livekit-server --tail 100
          } else {
            Write-Output "livekit-server listening"
          }

      - name: Report container status
        if: always()
        run: |
          Write-Output "--- infra + backend + frontend ---"
          docker compose --project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml ps
          Write-Output "--- live-agent ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps
          Write-Output "--- evaluation-agent (stt-accurate only) ---"
          docker compose --project-directory evaluation-agent -f evaluation-agent/docker-compose.yml ps

      - name: Print URLs
        # Plain ASCII only in this step (no apostrophes/em-dashes): this runner's
        # PowerShell choked on a curly-quote-adjacent apostrophe inside a double-quoted
        # string here before (TerminatorExpectedAtEndOfString), likely an encoding quirk.
        run: |
          Write-Output "entry point (nginx): http://26.67.31.6:12345"
          Write-Output "frontend (direct):   http://26.67.31.6:3000"
          Write-Output "backend health:      http://26.67.31.6:12345/api/health"
          Write-Output "stt (live):          http://26.67.31.6:3905/v1/models"
          Write-Output "tts (live):          http://26.67.31.6:3906"
          Write-Output "minio console:       http://26.67.31.6:3904"
          Write-Output "postgres:            26.67.31.6:3901"
          Write-Output "livekit signaling:   ws://26.67.31.6:3907 (also proxied at /rtc/ via nginx)"
          Write-Output "NOTE: live-agent LLM calls need claude login run once on this machine"
          Write-Output "under the runner service account, not done by this workflow."
