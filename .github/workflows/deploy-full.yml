name: deploy full stack (self-hosted)

# Единственный деплой-workflow в репо. Linux VPS, OpenRouter на LLM/STT/TTS,
# без GPU stt/tts, без claude login.
#
# Внешний HTTPS — порт 12345 (хостовые 80/443 заняты чужим nginx, например
# hook.trackitdev.ru). TLS — DNS-01 DuckDNS, не HTTP-01: порты 80/443 не занимаем.
# Пример: https://ainterviewer.duckdns.org:12345 (TLS_DOMAIN из vars, не хардкод).
#
# Три ОТДЕЛЬНЫХ `docker compose` вызова, не один со склейкой всех `-f` — при мульти-file
# compose относительные пути (env_file/build context/volumes) резолвятся относительно
# директории ПЕРВОГО `-f`-файла целиком для всех файлов разом, а не каждый относительно
# своей директории. infra/docker-compose.yml + docker-compose.dev.yml + docker-compose.vps.yml
# оба/все без относительных путей, кроме тех, что уже написаны относительно корня репо —
# их можно смешивать через `--project-directory .`. live-agent/ написан для запуска из
# СВОЕЙ директории (`build: .`, `env_file: .env`) — не трогаем, а задаём
# `--project-directory` явно, оставаясь в cwd репозитория (без `cd`).
#
# evaluation-agent — воркер batch-оценки: забирает durable-задачи из backend
# (POST /api/v1/evaluation-jobs/claim), оценивает через OpenRouter, шлёт отчёт.
# Поднимается отдельным compose-проектом последним, после health-check backend'а.
#
# ВАЖНО про сети: infra+backend+frontend — один compose-проект (`--project-directory .`),
# общая docker-сеть. live-agent и evaluation-agent — отдельные проекты, ходят к
# livekit-server/redis/backend по имени сервиса через ainterviewer-net (создаём до up).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-full
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    defaults:
      run:
        shell: bash
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TLS_DOMAIN: ${{ vars.TLS_DOMAIN || secrets.TLS_DOMAIN }}
      VPS_PUBLIC_IP: ${{ vars.VPS_PUBLIC_IP }}
      PUBLIC_HTTP_PORT: ${{ vars.PUBLIC_HTTP_PORT || '12345' }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Default clean: true runs `git clean -ffdx` first, which wipes ALL untracked
          # files - including infra/tls/ (the issued cert, never committed). That silently
          # forced a brand new certificate issuance on every single deploy regardless of
          # acme.sh's own skip-if-valid logic or the persisted acme-state volume, and is
          # the real reason we hit Let's Encrypt's 5-certs/168h rate limit (2026-09-05).
          # Every file this workflow itself needs fresh is already fully overwritten by
          # its own "Write ..." steps below, so disabling the clean has no other effect.
          clean: false

      - name: Check required secrets and variables
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "ERROR: secrets.OPENROUTER_API_KEY is empty"
            exit 1
          fi
          if [ -z "${TLS_DOMAIN:-}" ]; then
            echo "ERROR: vars.TLS_DOMAIN is empty (set Actions variable TLS_DOMAIN)"
            exit 1
          fi
          case "${TLS_DOMAIN}" in
            *.duckdns.org)
              if [ -z "${DUCKDNS_TOKEN:-}" ]; then
                echo "ERROR: secrets.DUCKDNS_TOKEN is empty (required for ${TLS_DOMAIN})"
                exit 1
              fi
              ;;
          esac
          echo "TLS_DOMAIN is set"

      - name: Load or create persistent machine secrets
        run: |
          SECRETS_FILE=/srv/ainterviewer/deploy-secrets.env
          mkdir -p /srv/ainterviewer
          if [ ! -f "$SECRETS_FILE" ]; then
            umask 077
            cat > "$SECRETS_FILE" <<EOF
          SECRET_KEY=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 32)
          LIVEKIT_API_KEY=$(openssl rand -hex 12)
          LIVEKIT_API_SECRET=$(openssl rand -hex 32)
          S3_ACCESS_KEY=$(openssl rand -hex 8)
          S3_SECRET_KEY=$(openssl rand -hex 24)
          LIVE_AGENT_TOKEN=$(openssl rand -hex 32)
          EVALUATION_SERVICE_TOKEN=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=ainterviewer
          EOF
            chmod 600 "$SECRETS_FILE"
            echo "created persist secrets file (values not printed)"
          else
            echo "reusing persist secrets file"
          fi
          # Миграция: файл создан до появления evaluation-agent — дописываем токен,
          # если его ещё нет (backend и evaluation-agent должны шарить ОДНО значение).
          if ! grep -q '^EVALUATION_SERVICE_TOKEN=' "$SECRETS_FILE"; then
            umask 077
            echo "EVALUATION_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$SECRETS_FILE"
            chmod 600 "$SECRETS_FILE"
            echo "added EVALUATION_SERVICE_TOKEN to persist secrets file"
          fi

      - name: Resolve public IP
        run: |
          if [ -z "${VPS_PUBLIC_IP:-}" ]; then
            VPS_PUBLIC_IP=$(curl -4 -s --max-time 5 ifconfig.me || true)
          fi
          if [ -z "${VPS_PUBLIC_IP:-}" ]; then
            echo "ERROR: public IP unknown — set vars.VPS_PUBLIC_IP"
            exit 1
          fi
          echo "VPS_PUBLIC_IP=${VPS_PUBLIC_IP}" >> "$GITHUB_ENV"
          echo "resolved public IP for livekit node_ip"

      - name: Point DuckDNS A-record at this VPS
        run: |
          case "${TLS_DOMAIN}" in
            *.duckdns.org)
              subdomain="${TLS_DOMAIN%.duckdns.org}"
              if [ -z "${subdomain}" ] || [ "${subdomain}" = "${TLS_DOMAIN}" ]; then
                echo "ERROR: could not parse DuckDNS subdomain from TLS_DOMAIN=${TLS_DOMAIN}"
                exit 1
              fi
              echo "updating DuckDNS ${subdomain} -> ${VPS_PUBLIC_IP}"
              curl -fsS "https://www.duckdns.org/update?domains=${subdomain}&token=${DUCKDNS_TOKEN}&ip=${VPS_PUBLIC_IP}&verbose=true"
              echo
              ;;
            *)
              echo "TLS_DOMAIN is not *.duckdns.org — skip DuckDNS A-record update"
              ;;
          esac

      - name: Ensure shared Docker network between this stack and live-agent
        run: |
          docker network create ainterviewer-net || true
          echo "ok"

      - name: Write backend/.env, frontend/.env, livekit configs, live-agent/.env
        run: |
          set -a
          # shellcheck disable=SC1091
          . /srv/ainterviewer/deploy-secrets.env
          set +a
          for v in SECRET_KEY JWT_SECRET LIVEKIT_API_KEY LIVEKIT_API_SECRET S3_ACCESS_KEY S3_SECRET_KEY LIVE_AGENT_TOKEN EVALUATION_SERVICE_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: $v is empty in /srv/ainterviewer/deploy-secrets.env"
              exit 1
            fi
          done

          umask 077
          cat > backend/.env <<EOF
          CORS_ORIGINS=["https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}"]
          APP_ENV=production
          APP_DEBUG=false
          APP_HOST=0.0.0.0
          APP_PORT=8000
          SECRET_KEY=${SECRET_KEY}
          JWT_SECRET=${JWT_SECRET}
          ADMIN_EMAILS=["admin@example.com"]
          POSTGRES_DB=ainterviewer
          POSTGRES_HOST=postgres
          POSTGRES_USER=ainterviewer
          POSTGRES_PASSWORD=ainterviewer
          DATABASE_URL=postgresql+asyncpg://ainterviewer:ainterviewer@postgres:5432/ainterviewer
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/1
          CELERY_RESULT_BACKEND=redis://redis:6379/2
          MINIO_ROOT_USER=${S3_ACCESS_KEY}
          MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
          MINIO_BUCKET=ainterviewer-resumes
          S3_ENDPOINT_URL=http://minio:9000
          S3_PUBLIC_ENDPOINT_URL=https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}/s3
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}
          S3_BUCKET=ainterviewer-resumes
          S3_REGION=us-east-1
          LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
          LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
          LIVEKIT_WS_URL=wss://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}
          LIVEKIT_API_URL=ws://livekit-server:7880
          RECORDINGS_S3_BUCKET=ainterviewer-recordings
          PUBLIC_FRONTEND_URL=https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}
          LIVE_AGENT_TOKEN=${LIVE_AGENT_TOKEN}
          EVALUATION_SERVICE_TOKEN=${EVALUATION_SERVICE_TOKEN}
          OPENROUTER_MODEL=google/gemini-2.5-flash
          EOF
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> backend/.env

          cat > frontend/.env <<EOF
          BACKEND_INTERNAL_URL=http://backend:8000
          NEXT_PUBLIC_BACKEND_URL=https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}
          EOF

          cat > infra/livekit.yaml <<EOF
          port: 7880
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            node_ip: ${VPS_PUBLIC_IP}
          keys:
            ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
          room:
            auto_create: true
          redis:
            address: redis:6379
          turn:
            enabled: true
            tls_port: 5349
            domain: ${TLS_DOMAIN}
            cert_file: /etc/ainterviewer-tls/fullchain.pem
            key_file: /etc/ainterviewer-tls/domain.key
          EOF

          # Иначе egress останется с локальным шаблоном, а MinIO/LiveKit уже на persist-ключах.
          cat > infra/livekit-egress-config.yaml <<EOF
          api_key: ${LIVEKIT_API_KEY}
          api_secret: ${LIVEKIT_API_SECRET}
          ws_url: ws://livekit-server:7880
          redis:
            address: redis:6379
          s3:
            access_key: ${S3_ACCESS_KEY}
            secret: ${S3_SECRET_KEY}
            bucket: ainterviewer-recordings
            endpoint: http://minio:9000
            force_path_style: true
            region: us-east-1
          EOF

          cat > live-agent/.env <<EOF
          LLM_PROVIDER=openrouter
          OPENROUTER_MODEL=google/gemini-2.5-flash
          STT_BASE_URL=https://openrouter.ai/api/v1
          TTS_BASE_URL=https://openrouter.ai/api/v1
          STT_MODEL=whisper-1
          TTS_MODEL=qwen/qwen-audio-3.0-tts-flash
          TTS_VOICE=loongjohn
          STT_LANGUAGE=ru
          MOCK_INTERVIEW_PATH=mock_data/interview_example.json
          BACKEND_BASE_URL=http://backend:8000
          LIVE_AGENT_TOKEN=${LIVE_AGENT_TOKEN}
          REDIS_URL=redis://redis:6379/0
          LIVEKIT_URL=ws://livekit-server:7880
          LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
          LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
          EOF
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> live-agent/.env
          printf 'STT_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> live-agent/.env
          printf 'TTS_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> live-agent/.env

          # evaluation-agent: тот же OpenRouter-ключ, что у backend/live-agent; токен
          # сервисный — общий с backend EVALUATION_SERVICE_TOKEN (claim/complete/fail
          # /api/v1/evaluation-jobs/* защищён им, см. backend/app/dependencies/auth.py).
          cat > evaluation-agent/.env <<EOF
          BACKEND_URL=http://backend:8000
          BACKEND_SERVICE_TOKEN=${EVALUATION_SERVICE_TOKEN}
          EVALUATION_LLM_PROVIDER=openrouter
          OPENROUTER_MODEL=google/gemini-2.5-flash
          EOF
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> evaluation-agent/.env
          echo "wrote env files (secrets not printed)"

      - name: Bootstrap TLS cert so nginx can listen on 443
        run: |
          mkdir -p infra/tls
          if [ ! -s infra/tls/fullchain.pem ] || [ ! -s infra/tls/domain.key ]; then
            echo "no cert on disk — writing temporary self-signed for ${TLS_DOMAIN}"
            openssl req -x509 -newkey rsa:2048 -nodes \
              -keyout infra/tls/domain.key \
              -out infra/tls/fullchain.pem \
              -days 7 \
              -subj "/CN=${TLS_DOMAIN}"
          else
            echo "existing cert files present, not overwriting"
          fi

      - name: Build and (re)start infra + backend + frontend
        env:
          TLS_DOMAIN: ${{ vars.TLS_DOMAIN || secrets.TLS_DOMAIN }}
        run: |
          set -a
          # shellcheck disable=SC1091
          . /srv/ainterviewer/deploy-secrets.env
          set +a
          export TLS_DOMAIN
          export S3_ACCESS_KEY
          export S3_SECRET_KEY
          export PUBLIC_HTTP_PORT="${PUBLIC_HTTP_PORT:-12345}"
          export NEXT_PUBLIC_BACKEND_URL="https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}"

          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            down --remove-orphans

          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            up -d --build \
            postgres redis minio livekit-server livekit-egress backend frontend nginx

      - name: Wait for backend health
        run: |
          ok=0
          for i in $(seq 1 24); do
            if docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" \
              2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: backend did not become healthy in time"
            docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              logs backend --tail 100
            exit 1
          fi
          echo "backend healthy"

      - name: Obtain/renew TLS certificate (DNS-01 DuckDNS)
        run: |
          set -a
          # shellcheck disable=SC1091
          . /srv/ainterviewer/deploy-secrets.env
          set +a
          export TLS_DOMAIN
          export DUCKDNS_TOKEN
          export S3_ACCESS_KEY
          export S3_SECRET_KEY
          export PUBLIC_HTTP_PORT="${PUBLIC_HTTP_PORT:-12345}"
          export NEXT_PUBLIC_BACKEND_URL="https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}"

          for i in $(seq 1 30); do
            state=$(docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              ps --format '{{.State}}' nginx 2>/dev/null || true)
            if [ "$state" = "running" ]; then
              break
            fi
            sleep 2
          done

          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            run --rm acme \
            || echo "WARNING: acme failed — keeping cert already on disk"

          # livekit-server не перечитывает cert; nginx тоже надёжнее пересоздать.
          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            up -d --force-recreate nginx livekit-server

      - name: Build and (re)start live-agent
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml up -d --build --remove-orphans

      - name: Build and (re)start evaluation-agent
        run: |
          # Только воркер: stt-accurate (profile stt) в деплой не входит — воркер STT
          # не вызывает, транскрипты берёт из backend.
          # Fresh worker logs make the readiness check below belong to this deploy, not a
          # container that Compose happened to keep from a prior deploy.
          docker compose --project-directory evaluation-agent -f evaluation-agent/docker-compose.yml up -d --build --force-recreate --remove-orphans evaluation-agent

      - name: Wait for evaluation-agent worker
        run: |
          ok=0
          for i in $(seq 1 12); do
            state=$(docker compose --project-directory evaluation-agent \
              -f evaluation-agent/docker-compose.yml \
              ps --format '{{.State}}' evaluation-agent 2>/dev/null || true)
            if [ "$state" = "running" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: evaluation-agent did not stay running"
            docker compose --project-directory evaluation-agent \
              -f evaluation-agent/docker-compose.yml \
              logs evaluation-agent --tail 100
            exit 1
          fi
          # The container is recreated above, so these are this deploy's logs. Do not use
          # --since here: a retained container made that window omit its valid startup log.
          logs=""
          for i in $(seq 1 12); do
            logs=$(docker compose --project-directory evaluation-agent \
              -f evaluation-agent/docker-compose.yml \
              logs evaluation-agent --tail 100 2>/dev/null || true)
            if printf '%s' "$logs" | grep -q 'Worker started'; then
              break
            fi
            sleep 5
          done
          if ! printf '%s' "$logs" | grep -q 'Worker started'; then
            echo "ERROR: evaluation-agent did not log 'Worker started' (bad provider config?):"
            printf '%s\n' "$logs" | tail -100
            exit 1
          fi
          # A 200 claim confirms the worker can resolve and authenticate to backend.
          # A single earlier DNS failure is recoverable and must not fail a healthy deploy.
          for i in $(seq 1 12); do
            logs=$(docker compose --project-directory evaluation-agent \
              -f evaluation-agent/docker-compose.yml \
              logs evaluation-agent --tail 100 2>/dev/null || true)
            if printf '%s' "$logs" | grep -q 'POST http://backend:8000/api/v1/evaluation-jobs/claim "HTTP/1.1 200 OK"'; then
              break
            fi
            sleep 5
          done
          if ! printf '%s' "$logs" | grep -q 'POST http://backend:8000/api/v1/evaluation-jobs/claim "HTTP/1.1 200 OK"'; then
            echo "ERROR: evaluation-agent did not successfully claim from backend:"
            printf '%s\n' "$logs" | tail -100
            exit 1
          fi
          echo "evaluation-agent running"

      - name: Wait for minio health
        run: |
          ok=0
          for i in $(seq 1 24); do
            if docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              exec -T minio mc ready local \
              2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: minio did not become healthy in time"
            exit 1
          fi
          echo "minio healthy"

      - name: Wait for livekit-server
        run: |
          ok=0
          for i in $(seq 1 24); do
            if docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              exec -T backend python -c "import socket; socket.create_connection(('livekit-server', 7880), 3).close()" \
              2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "WARNING: livekit-server did not come up in time - check logs"
            docker compose --project-directory . \
              -f docker-compose.dev.yml \
              -f infra/docker-compose.yml \
              -f docker-compose.vps.yml \
              logs livekit-server --tail 100
          else
            echo "livekit-server listening"
          fi

      - name: Report container status
        if: always()
        run: |
          echo "--- infra + backend + frontend ---"
          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            ps -a
          echo "--- livekit-egress logs (tail) ---"
          docker compose --project-directory . \
            -f docker-compose.dev.yml \
            -f infra/docker-compose.yml \
            -f docker-compose.vps.yml \
            logs --tail=80 livekit-egress || true
          echo "--- live-agent ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps
          echo "--- evaluation-agent ---"
          docker compose --project-directory evaluation-agent -f evaluation-agent/docker-compose.yml ps
          echo "--- evaluation-agent logs (tail) ---"
          docker compose --project-directory evaluation-agent -f evaluation-agent/docker-compose.yml logs --tail=80 evaluation-agent || true

      - name: Print URLs
        run: |
          echo "entry point (nginx): https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}"
          echo "backend health:      https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}/api/health"
          echo "livekit signaling:   wss://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}/rtc/"
          echo "livekit TURN/TLS:    ${TLS_DOMAIN}:5349"
          echo "S3 via nginx:        https://${TLS_DOMAIN}:${PUBLIC_HTTP_PORT}/s3"
