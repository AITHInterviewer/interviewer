name: diagnose tts 500 (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Confirm env var is actually set in the running container
        run: docker exec live-agent-tts-1 sh -c "env | grep -i xet || echo NOT_SET"

      - name: TTS container logs (tail)
        run: docker logs live-agent-tts-1 --tail 150
