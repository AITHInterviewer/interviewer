name: evaluation-agent CI

on:
  push:
    paths:
      - "evaluation-agent/**"
      - ".github/workflows/evaluation-agent-ci.yml"
  pull_request:
    paths:
      - "evaluation-agent/**"
      - ".github/workflows/evaluation-agent-ci.yml"

defaults:
  run:
    working-directory: evaluation-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: evaluation-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      # worker.py сознательно NotImplementedError (см. README) — тестируется только
      # verdict.py, единственная реализованная часть.
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ainterviewer-evaluation-agent .
