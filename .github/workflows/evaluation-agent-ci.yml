name: evaluation-agent CI

on:
  push:
    paths:
      - "evaluation-agent/**"
      - ".github/workflows/evaluation-agent-ci.yml"
  pull_request:
    paths:
      - "evaluation-agent/**"
      - ".github/workflows/evaluation-agent-ci.yml"

defaults:
  run:
    working-directory: evaluation-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pyproject.toml требует >=3.12 (match-стейтменты и т.п.); Docker-образ
          # python:3.12-slim — версия здесь должна совпадать, иначе pip падает с
          # "requires a different Python" (CI-фейл 2026-09-07).
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: evaluation-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      # Воркер реализован (worker.py + llm_judge.py) — прогоняем весь набор тестов.
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ainterviewer-evaluation-agent .
