name: diagnose live-agent logs (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent status + logs
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps
          Write-Output "--- logs ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs live-agent --tail 200
