name: diagnose stt tts (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: STT/TTS container status
        run: docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps

      - name: STT health
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3905/v1/models" -UseBasicParsing -TimeoutSec 10
            Write-Output "STT OK: $($r.StatusCode)"
            Write-Output $r.Content.Substring(0, [Math]::Min(500, $r.Content.Length))
          } catch {
            Write-Output "STT FAILED: $($_.Exception.Message)"
          }

      - name: TTS health (speaches models list)
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3906/v1/models" -UseBasicParsing -TimeoutSec 10
            Write-Output "TTS OK: $($r.StatusCode)"
            Write-Output $r.Content.Substring(0, [Math]::Min(500, $r.Content.Length))
          } catch {
            Write-Output "TTS FAILED: $($_.Exception.Message)"
          }

      - name: TTS actual synth call (what session.say() does)
        run: |
          try {
            $body = @{ model = "speaches-ai/piper-ru_RU-irina-medium"; voice = "irina"; input = "Привет"; response_format = "mp3" } | ConvertTo-Json
            $r = Invoke-WebRequest -Uri "http://localhost:3906/v1/audio/speech" -Method Post -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 30
            Write-Output "TTS synth OK: $($r.StatusCode), bytes=$($r.RawContentLength)"
          } catch {
            Write-Output "TTS synth FAILED: $($_.Exception.Message)"
          }

      - name: TTS logs
        run: docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs tts --tail 60
