# Разовая джоба: переписывает мок-отчёты демо-кандидатов на канон 0–3
# (ответы, протокол, report_json). Живых кандидатов не трогает.
name: refresh mock candidate reports

on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: [self-hosted, vps]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Rewrite mock reports inside backend
        run: |
          # VPS-образ backend не копирует scripts/ и без bind-mount (volumes: !reset []).
          main=(--project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.vps.yml)
          docker compose "${main[@]}" cp backend/scripts/refresh_mock_candidate_reports.py \
            backend:/app/refresh_mock_candidate_reports.py
          docker compose "${main[@]}" exec -T backend python /app/refresh_mock_candidate_reports.py
