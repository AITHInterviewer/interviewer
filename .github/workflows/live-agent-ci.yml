name: live-agent CI

on:
  push:
    paths:
      - "live-agent/**"
      - ".github/workflows/live-agent-ci.yml"
  pull_request:
    paths:
      - "live-agent/**"
      - ".github/workflows/live-agent-ci.yml"

defaults:
  run:
    working-directory: live-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: live-agent/pyproject.toml
      # Тесты и scripts/simulate.py гоняют на FakeLLM — Claude-подписка/сеть не нужны,
      # см. live-agent/README.md, раздел «Почему граф — код».
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ainterviewer-live-agent .
