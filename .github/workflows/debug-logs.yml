# Read-only debug helper for the self-hosted deploy runner — dumps recent container logs
# so we can diagnose a stuck/misbehaving live interview without SSHing into the runner
# by hand. Never touches state (no `up`/`down`/`restart`), safe to run any time.
name: debug container logs (self-hosted)

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional text to filter log lines by (e.g. an interview id/access token)"
        required: false
        default: ""
      tail:
        description: "How many lines to tail per service before filtering"
        required: false
        default: "500"

jobs:
  logs:
    runs-on: self-hosted
    steps:
      - name: Checkout (for compose files only, no build)
        uses: actions/checkout@v4

      - name: Dump backend + live-agent + livekit-server + livekit-egress logs
        shell: pwsh
        run: |
          $grep = "${{ github.event.inputs.grep }}"
          $tail = "${{ github.event.inputs.tail }}"

          function Show-Logs($label, $composeArgs, $service) {
            Write-Output "--- $label ---"
            $lines = docker compose @composeArgs logs --no-color --tail=$tail $service 2>&1
            if ($grep) {
              $lines | Select-String -SimpleMatch $grep
            } else {
              $lines
            }
          }

          Show-Logs "backend" @("--project-directory", ".", "-f", "docker-compose.dev.yml", "-f", "infra/docker-compose.yml") "backend"
          Show-Logs "livekit-server" @("--project-directory", ".", "-f", "docker-compose.dev.yml", "-f", "infra/docker-compose.yml") "livekit-server"
          Show-Logs "livekit-egress" @("--project-directory", ".", "-f", "docker-compose.dev.yml", "-f", "infra/docker-compose.yml") "livekit-egress"
          Show-Logs "live-agent" @("--project-directory", "live-agent", "-f", "live-agent/docker-compose.yml") "live-agent"
          Show-Logs "stt" @("--project-directory", "live-agent", "-f", "live-agent/docker-compose.yml") "stt"
          Show-Logs "tts" @("--project-directory", "live-agent", "-f", "live-agent/docker-compose.yml") "tts"

          Write-Output "--- container status (live-agent stack) ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -a

          # Не печатаем сам ANTHROPIC_BASE_URL/ключ — только код ответа/ошибку, чтобы понять,
          # реально ли live-agent видит прокси по сети (ConnectTimeout в логах — это может
          # быть сам прокси недоступен, а не проблема с ключом). curl нет в образе (найдено
          # 2026-09-06) — используем python (уже есть в рантайме) через httpx.
          Write-Output "--- anthropic proxy reachability (from inside live-agent container) ---"
          $pyCheck = "import os,time`nimport httpx`nu=os.environ['ANTHROPIC_BASE_URL'].rstrip('/')+'/v1/messages'`ns=time.monotonic()`ntry:`n r=httpx.post(u,headers={'x-api-key':os.environ['ANTHROPIC_API_KEY'],'anthropic-version':'2023-06-01'},json={},timeout=8.0)`n print('HTTP',r.status_code,'after',round(time.monotonic()-s,2),'s')`nexcept Exception as exc:`n print(type(exc).__name__,str(exc),'after',round(time.monotonic()-s,2),'s')"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python -c $pyCheck
