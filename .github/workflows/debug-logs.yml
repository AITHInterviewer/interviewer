# Read-only debug helper for the self-hosted deploy runner — dumps recent container logs
# so we can diagnose a stuck/misbehaving live interview without SSHing into the runner
# by hand. Never touches state (no `up`/`down`/`restart`), safe to run any time.
name: debug container logs (self-hosted)

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional text to filter log lines by (e.g. an interview id/access token)"
        required: false
        default: ""
      tail:
        description: "How many lines to tail per service before filtering"
        required: false
        default: "500"
      probe:
        description: "Also call OpenRouter TTS from inside the agent container ('false' to skip)"
        required: false
        default: "true"
      vacancy_probe:
        description: "Прогнать разбор описания вакансии и сборку вопросов боевой моделью ('true' чтобы включить)"
        required: false
        default: "false"

jobs:
  logs:
    runs-on: [self-hosted, vps]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (for compose files only, no build)
        uses: actions/checkout@v4
        with:
          # Same runner workspace as deploy-full — do not git-clean infra/tls.
          clean: false

      - name: Dump backend + live-agent + livekit-server + livekit-egress logs
        run: |
          grep="${{ github.event.inputs.grep }}"
          tail="${{ github.event.inputs.tail }}"

          show_logs() {
            label="$1"
            shift
            service="$1"
            shift
            echo "--- $label ---"
            if [ -n "$grep" ]; then
              docker compose "$@" logs --no-color --tail="$tail" "$service" 2>&1 | grep -F -- "$grep" || true
            else
              docker compose "$@" logs --no-color --tail="$tail" "$service" 2>&1 || true
            fi
          }

          main=(--project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.vps.yml)
          agent=(--project-directory live-agent -f live-agent/docker-compose.yml)

          show_logs backend backend "${main[@]}"
          show_logs livekit-server livekit-server "${main[@]}"
          show_logs livekit-egress livekit-egress "${main[@]}"
          show_logs live-agent live-agent "${agent[@]}"

          echo "--- container status (live-agent stack) ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -a

      # Read-only: применена ли миграция контура оценки на боевой БД и не застряли ли
      # интервью в in_progress (симптом — column interview_event.source_event_id does not
      # exist → каждый record_event падает → статус не доходит до completed).
      - name: DB state (alembic head, interview_event schema, stuck interviews)
        if: ${{ github.event.inputs.probe != 'false' }}
        run: |
          set +e
          main=(--project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.vps.yml)
          runq() {
            echo "--- $1 ---"
            docker compose "${main[@]}" exec -T postgres \
              psql -U ainterviewer -d ainterviewer -X -A -F' | ' -c "$2" 2>&1
          }
          runq "alembic_version (ждём голову цепочки — 20260907_000001)" \
            "select version_num from alembic_version;"
          runq "interview_event columns (ждём source_event_id)" \
            "select column_name from information_schema.columns where table_name='interview_event' order by 1;"
          runq "interview — статусы за сутки" \
            "select id, status, product_state, created_at, completed_at from interview where created_at > now() - interval '24 hours' order by created_at desc;"
          runq "evaluation_job" \
            "select interview_id, status, attempts, last_error from evaluation_job order by created_at desc limit 10;"
          echo "--- backend: последние строки alembic при старте ---"
          docker compose "${main[@]}" logs --no-color backend 2>&1 | grep -iE "alembic|revision|running upgrade|target database|FAILED|ERROR" | tail -30

      # Голос и распознавание переехали в OpenRouter (docs/infra/vps-openrouter-migration.md),
      # и «агент молчит» отличается от «агент не слышит» только тем, какая из двух облачных
      # ручек отдала ошибку — в логах воркера этого не видно, пока не начнётся живая сессия.
      # Проба идёт ИЗ КОНТЕЙНЕРА агента и тем же клиентом (lk_openai.TTS/STT), что и боевой
      # путь: те же base_url/ключ/модель/голос и те же параметры запроса, которые добавляет
      # плагин (stream_format, speed) и которых не было в ручных curl-проверках при переезде.
      - name: Probe OpenRouter TTS/STT the way the agent calls them
        if: ${{ github.event.inputs.probe != 'false' }}
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml \
            exec -T live-agent python - <<'PY'
          import asyncio, os

          from livekit.plugins import openai as lk_openai

          from ainterviewer.agent import _OpenRouterSTT

          PHRASE = "Здравствуйте! Расскажите про свой опыт работы с очередями сообщений."


          async def probe_tts() -> list:
              """Синтезируем фразу и отдаём аудио-фреймы — вход для проверки STT."""
              tts = lk_openai.TTS(
                  base_url=os.environ["TTS_BASE_URL"],
                  api_key=os.environ["TTS_API_KEY"],
                  model=os.environ.get("TTS_MODEL", "fish-audio/s1"),
                  voice=os.environ.get("TTS_VOICE") or "alloy",
              )
              return [ev.frame async for ev in tts.synthesize(PHRASE)]


          # id моделей для проверки STT — тем же _OpenRouterSTT (боевой путь:
          # /audio/transcriptions + response_format=json). Список правится здесь, чтобы
          # подобрать модель, которая И принимается OpenRouter, И проходит pre-flight
          # проверку баланса (для дорогих аудио-моделей нужно >= $0.50 на счету).
          STT_MODELS = [
              m.strip()
              for m in (
                  os.environ.get("STT_PROBE_MODELS")
                  or f"{os.environ.get('STT_MODEL', 'whisper-1')},mistralai/voxtral-small-24b-2507-stt"
              ).split(",")
              if m.strip()
          ]


          async def probe_stt(frames: list, model: str, *, with_prompt: bool) -> None:
              kwargs = dict(
                  base_url=os.environ["STT_BASE_URL"],
                  api_key=os.environ["STT_API_KEY"],
                  model=model,
                  language=os.environ.get("STT_LANGUAGE", "ru"),
              )
              if with_prompt:
                  kwargs["prompt"] = "Kafka, RabbitMQ, idempotency, dead-letter queue"
              stt = _OpenRouterSTT(**kwargs)
              tag = f"{model} (prompt={'on' if with_prompt else 'off'})"
              try:
                  ev = await stt.recognize(frames)
              except Exception as exc:
                  print(f"STT {tag} FAILED: {type(exc).__name__}: {exc}")
              else:
                  print(f"STT {tag} OK: {ev.alternatives[0].text!r}")


          async def main() -> None:
              for name in ("TTS_BASE_URL", "TTS_MODEL", "TTS_VOICE", "STT_BASE_URL", "STT_MODEL"):
                  print(f"{name:13}=", os.environ.get(name))
              print("STT_MODELS   =", STT_MODELS)
              try:
                  frames = await probe_tts()
              except Exception as exc:
                  print(f"TTS FAILED: {type(exc).__name__}: {exc}")
                  return
              total = sum(f.samples_per_channel for f in frames)
              print(f"TTS OK: {len(frames)} frames, {total} samples")
              for model in STT_MODELS:
                  await probe_stt(frames, model, with_prompt=False)
                  await probe_stt(frames, model, with_prompt=True)
          asyncio.run(main())
          PY

      # Единственное звено флоу вакансии, которое нельзя проверить тестами: что боевая
      # модель на самом деле отвечает по vacancy_requirements_extract.txt и
      # vacancy_question_set.txt строгим JSON нужной формы. Ключ живёт в backend/.env на
      # раннере — проба идёт ИЗ backend-контейнера тем же клиентом, что и продакшн-путь,
      # и ничего не пишет в базу. Выключена по умолчанию: это платный вызов модели.
      - name: Probe vacancy requirement extraction + question set
        if: ${{ github.event.inputs.vacancy_probe == 'true' }}
        run: |
          set +e
          main=(--project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.vps.yml)
          docker compose "${main[@]}" exec -T backend python - <<'PY'
          import asyncio
          import os

          from app.services.vacancy_llm_service import VacancyLLMService

          DESCRIPTION = """Middle + Python Developer
          Уровень должности: Middle
          Опыт работы: от 3 лет коммерческой разработки
          Обязанности:
          - Разработка и поддержка высоконагруженных микросервисов;
          - Интеграция с Kafka для обработки потоков данных;
          - Проектирование Event Sourcing и CQRS паттернов;
          - Настройка мониторинга и алертинга сервисов;
          - Участие в Code review.
          Требования:
          - Опыт работы с Python от 5 лет;
          - Django/FastAPI - опыт разработки REST API;
          - Микросервисная архитектура - опыт проектирования и поддержки;
          - Apache Kafka - продакшн опыт работы с producers/consumers;
          - PostgreSQL - проектирование схем, оптимизация запросов;
          - ETL процессы - Extract, Transform, Load данных;
          - Docker/Kubernetes - контейнеризация и оркестрация;
          - Event-driven архитектура - паттерны работы с событиями;
          - Мониторинг: Prometheus, Grafana или аналоги;
          - Git, CI/CD - DevOps практики.
          Будет плюсом:
          - Знание gRPC для межсервисного взаимодействия;
          - Опыт с ELK Stack;
          - Знание Domain-Driven Design (DDD).
          Условия:
          - Удаленная работа, гибкое начало и конец рабочего дня.
          - Оплату участия в профильных онлайн-конференциях (HighLoad++, Podlodka).
          - Доступ к курсам нашей объединенной IT-школы GIGASCHOOL.
          """


          class _Vacancy:
              """Ровно те поля, которые читает _vacancy_prompt — в базу не ходим."""

              def __init__(self, title, grade, description, requirements):
                  self.title = title
                  self.grade = grade
                  self.description = description
                  self.requirements = requirements
                  self.required_skills = [r["name"] for r in requirements]
                  self.nice_to_have_skills = []


          async def main() -> None:
              print("model =", os.environ.get("OPENROUTER_MODEL", "(default)"))
              service = VacancyLLMService()

              extracted = await service.extract_requirements(DESCRIPTION)
              print(f"\n=== ТРЕБОВАНИЯ ({len(extracted.requirements)}) ===")
              print("title =", extracted.title, "| grade =", extracted.grade)
              for item in extracted.requirements:
                  print(f"  {item.kind:4} {item.level:9} {item.name}  <- {item.evidence[:60]}")
              print(f"\n--- excluded ({len(extracted.excluded)}) ---")
              for item in extracted.excluded[:8]:
                  print(f"  {item.text[:60]} :: {item.reason}")
              print("--- warnings ---")
              for w in extracted.warnings:
                  print(" ", w)

              kinds = {i.kind for i in extracted.requirements}
              levels = {i.level for i in extracted.requirements}
              print(f"\nПРОВЕРКА: требований={len(extracted.requirements)} (ждём <=10),"
                    f" kind={sorted(kinds)}, level={sorted(levels)}")
              if len(kinds) == 1 or len(levels) == 1:
                  print("ВНИМАНИЕ: модель поставила один и тот же kind/level всему списку.")

              requirements = [
                  {**item.model_dump(), "id": f"req_{i}", "source": "llm"}
                  for i, item in enumerate(extracted.requirements[:10])
              ]
              vacancy = _Vacancy(extracted.title, extracted.grade, DESCRIPTION, requirements)
              generated = await service.generate_questions(vacancy)

              print(f"\n=== ВОПРОСЫ ({len(generated.questions)}) ===")
              for q in generated.questions:
                  print(f"  [{q.role}] {q.skill_tag} {q.estimated_duration_sec}s :: {q.text[:90]}")

              wanted = {r["name"].strip().lower() for r in requirements}
              covered = {
                  t.strip().lower()
                  for q in generated.questions
                  if q.role == "assessment"
                  for t in q.skill_tag
              }
              missing = sorted(wanted - covered)
              print("\nПОКРЫТИЕ:", "полное" if not missing else f"НЕ ЗАКРЫТЫ: {missing}")


          asyncio.run(main())
          PY
