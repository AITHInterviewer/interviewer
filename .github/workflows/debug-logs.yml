# Read-only debug helper for the self-hosted deploy runner — dumps recent container logs
# so we can diagnose a stuck/misbehaving live interview without SSHing into the runner
# by hand. Never touches state (no `up`/`down`/`restart`), safe to run any time.
name: debug container logs (self-hosted)

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional text to filter log lines by (e.g. an interview id/access token)"
        required: false
        default: ""
      tail:
        description: "How many lines to tail per service before filtering"
        required: false
        default: "500"
      probe:
        description: "Also call OpenRouter TTS from inside the agent container ('false' to skip)"
        required: false
        default: "true"

jobs:
  logs:
    runs-on: [self-hosted, vps]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (for compose files only, no build)
        uses: actions/checkout@v4
        with:
          # Same runner workspace as deploy-full — do not git-clean infra/tls.
          clean: false

      - name: Dump backend + live-agent + livekit-server + livekit-egress logs
        run: |
          grep="${{ github.event.inputs.grep }}"
          tail="${{ github.event.inputs.tail }}"

          show_logs() {
            label="$1"
            shift
            service="$1"
            shift
            echo "--- $label ---"
            if [ -n "$grep" ]; then
              docker compose "$@" logs --no-color --tail="$tail" "$service" 2>&1 | grep -F -- "$grep" || true
            else
              docker compose "$@" logs --no-color --tail="$tail" "$service" 2>&1 || true
            fi
          }

          main=(--project-directory . -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.vps.yml)
          agent=(--project-directory live-agent -f live-agent/docker-compose.yml)

          show_logs backend backend "${main[@]}"
          show_logs livekit-server livekit-server "${main[@]}"
          show_logs livekit-egress livekit-egress "${main[@]}"
          show_logs live-agent live-agent "${agent[@]}"

          echo "--- container status (live-agent stack) ---"
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml ps -a

      # Голос и распознавание переехали в OpenRouter (docs/infra/vps-openrouter-migration.md),
      # и «агент молчит» отличается от «агент не слышит» только тем, какая из двух облачных
      # ручек отдала ошибку — в логах воркера этого не видно, пока не начнётся живая сессия.
      # Проба идёт ИЗ КОНТЕЙНЕРА агента и тем же клиентом (lk_openai.TTS/STT), что и боевой
      # путь: те же base_url/ключ/модель/голос и те же параметры запроса, которые добавляет
      # плагин (stream_format, speed) и которых не было в ручных curl-проверках при переезде.
      - name: Probe OpenRouter TTS/STT the way the agent calls them
        if: ${{ github.event.inputs.probe != 'false' }}
        run: |
          docker compose --project-directory live-agent -f live-agent/docker-compose.yml \
            exec -T live-agent python - <<'PY'
          import asyncio, os

          from livekit.plugins import openai as lk_openai

          PHRASE = "Здравствуйте! Это проверка синтеза речи."


          async def probe_tts() -> bytes:
              """Синтезируем фразу и отдаём её же как WAV — вход для проверки STT."""
              from livekit import rtc

              tts = lk_openai.TTS(
                  base_url=os.environ["TTS_BASE_URL"],
                  api_key=os.environ["TTS_API_KEY"],
                  model=os.environ.get("TTS_MODEL", "fish-audio/s1"),
                  voice=os.environ.get("TTS_VOICE") or "alloy",
              )
              frames = [ev.frame async for ev in tts.synthesize(PHRASE)]
              return rtc.combine_audio_frames(frames).to_wav_bytes()


          # Плагин сам выбирает response_format и для модели, названной ровно "whisper-1",
          # жёстко ставит verbose_json (stt.py, _recognize_impl) — а OpenRouter его не
          # принимает. Ручку не настроить, поэтому подбираем id модели, который OpenRouter
          # берёт И не включает эту ветку плагина.
          STT_MODEL_CANDIDATES = [
              "whisper-1",
              "openai/whisper-1",
              "openai/gpt-4o-transcribe",
              "openai/gpt-4o-mini-transcribe",
          ]


          async def probe_stt(wav: bytes, model: str) -> None:
              import openai

              client = openai.AsyncClient(
                  api_key=os.environ["STT_API_KEY"], base_url=os.environ["STT_BASE_URL"]
              )
              fmt = "verbose_json" if model == "whisper-1" else "json"
              try:
                  resp = await client.audio.transcriptions.create(
                      file=("file.wav", wav, "audio/wav"),
                      model=model,
                      language="ru",
                      response_format=fmt,
                  )
              except Exception as exc:
                  print(f"  STT {model!r} (response_format={fmt}) FAILED: {exc}")
              else:
                  print(f"  STT {model!r} (response_format={fmt}) OK: {resp.text!r}")
              finally:
                  await client.close()


          async def main() -> None:
              for name in ("TTS_BASE_URL", "TTS_MODEL", "TTS_VOICE", "STT_BASE_URL", "STT_MODEL"):
                  print(f"{name:13}=", os.environ.get(name))
              try:
                  wav = await probe_tts()
              except Exception as exc:
                  print(f"TTS FAILED: {type(exc).__name__}: {exc}")
                  return
              print(f"TTS OK: {len(wav)} wav bytes")
              print("--- STT candidates (same audio for each) ---")
              for model in STT_MODEL_CANDIDATES:
                  await probe_stt(wav, model)
          asyncio.run(main())
          PY
