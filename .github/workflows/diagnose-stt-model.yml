name: diagnose STT model load (self-hosted)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Trigger a real transcription to force large-v3 model load
        continue-on-error: true
        run: |
          Get-Content live-agent/ensure_stt_model.py | docker compose --project-directory live-agent -f live-agent/docker-compose.yml exec -T live-agent python3 - http://stt:8000 Systran/faster-whisper-large-v3

      - name: GPU process check after transcription attempt
        continue-on-error: true
        run: docker exec live-agent-stt-1 nvidia-smi

      - name: Inspect large-v3 cache dir
        continue-on-error: true
        run: docker exec live-agent-stt-1 find /root/.cache/huggingface/hub/models--Systran--faster-whisper-large-v3 -maxdepth 3 2>&1

      - name: Full STT logs
        run: docker compose --project-directory live-agent -f live-agent/docker-compose.yml logs stt --tail 300
