name: diagnose silent agent (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: tts full recent log
        continue-on-error: true
        run: docker logs --tail 150 live-agent-tts-1

      - name: live-agent full recent log
        continue-on-error: true
        run: docker logs --tail 200 live-agent-live-agent-1

      - name: container status
        continue-on-error: true
        run: docker ps -a --format "table {{.Names}}\t{{.Status}}"
