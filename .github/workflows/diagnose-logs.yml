name: restore tls cert from running container (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check current state
        continue-on-error: true
        run: |
          Write-Output "--- infra/tls on host ---"
          Get-ChildItem infra/tls -ErrorAction SilentlyContinue
          Write-Output "--- inside running nginx container ---"
          docker exec interviewer-nginx-1 ls -la /etc/ainterviewer-tls/

      - name: copy cert files out of the running nginx container
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force infra/tls | Out-Null
          docker cp interviewer-nginx-1:/etc/ainterviewer-tls/fullchain.pem infra/tls/fullchain.pem
          docker cp interviewer-nginx-1:/etc/ainterviewer-tls/domain.key infra/tls/domain.key
          Get-ChildItem infra/tls
