name: diagnose container logs (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: nginx
        continue-on-error: true
        run: docker logs --tail 100 interviewer-nginx-1

      - name: backend
        continue-on-error: true
        run: docker logs --tail 100 interviewer-backend-1

      - name: livekit-server
        continue-on-error: true
        run: docker logs --tail 150 interviewer-livekit-server-1

      - name: frontend
        continue-on-error: true
        run: docker logs --tail 100 interviewer-frontend-1

      - name: container list
        continue-on-error: true
        run: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
