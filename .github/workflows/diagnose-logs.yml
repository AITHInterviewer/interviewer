name: diagnose live-agent llm (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent full recent log
        continue-on-error: true
        run: docker logs --tail 300 live-agent-live-agent-1
