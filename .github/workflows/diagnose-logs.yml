name: diagnose live-agent network fix (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent can reach backend now?
        continue-on-error: true
        run: docker exec live-agent-live-agent-1 sh -c "curl -sS -m 5 -o /dev/null -w 'backend health: %{http_code}\n' http://backend:8000/api/health"

      - name: live-agent recent log
        continue-on-error: true
        run: docker logs --tail 150 live-agent-live-agent-1

      - name: tts recent log
        continue-on-error: true
        run: docker logs --tail 60 live-agent-tts-1

      - name: nvidia-smi on host
        continue-on-error: true
        run: nvidia-smi
