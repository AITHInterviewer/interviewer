name: final verify tts url (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent env
        run: docker exec live-agent-live-agent-1 env | Select-String "TTS_BASE_URL"

      - name: live-agent recent log
        continue-on-error: true
        run: docker logs --tail 30 live-agent-live-agent-1
