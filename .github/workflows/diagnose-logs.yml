name: diagnose tts xet env (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: tts container env
        run: docker exec live-agent-tts-1 env | Select-String "HF_|XET"

      - name: huggingface_hub version
        continue-on-error: true
        run: docker exec live-agent-tts-1 python3 -c "import huggingface_hub; print(huggingface_hub.__version__)"
