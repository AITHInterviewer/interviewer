name: probe fish speech api (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: list all routes fish-speech actually registered
        continue-on-error: true
        run: |
          docker exec live-agent-tts-1 python3 -c "from tools.server.views import routes; [print(r.methods, r.path) for r in routes.http_routes]"

      - name: raw http probe of /v1/tts
        continue-on-error: true
        run: |
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:3906/v1/tts" -Method Post -Body "{}" -ContentType "application/json" -TimeoutSec 15 -UseBasicParsing
            Write-Output "status: $($resp.StatusCode)"
            Write-Output $resp.Content
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              $stream = $_.Exception.Response.GetResponseStream()
              $reader = New-Object System.IO.StreamReader($stream)
              Write-Output $reader.ReadToEnd()
            }
          }

      - name: probe root and openapi
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "http://localhost:3906/" -TimeoutSec 10 -UseBasicParsing | Select-Object StatusCode
          try {
            (Invoke-WebRequest -Uri "http://localhost:3906/openapi.json" -TimeoutSec 10 -UseBasicParsing).Content
          } catch {
            Write-Output "no openapi.json: $($_.Exception.Message)"
          }
