name: verify tts base url fixed (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent env
        run: docker exec live-agent-live-agent-1 env | Select-String "TTS_BASE_URL"

      - name: tts status
        run: docker ps --filter "name=live-agent-tts-1" --format "table {{.Names}}\t{{.Status}}"

      - name: live-agent recent log
        continue-on-error: true
        run: docker logs --tail 40 live-agent-live-agent-1
