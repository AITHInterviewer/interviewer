name: verify reference voice (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: check reference files exist in the container
        continue-on-error: true
        run: docker exec live-agent-tts-1 find references -type f

      - name: live-agent recent log
        continue-on-error: true
        run: docker logs --tail 60 live-agent-live-agent-1

      - name: tts recent log
        continue-on-error: true
        run: docker logs --tail 40 live-agent-tts-1
