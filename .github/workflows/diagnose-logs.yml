name: diagnose false interruption (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent full recent log
        continue-on-error: true
        run: docker logs --tail 400 live-agent-live-agent-1

      - name: livekit-agents version
        continue-on-error: true
        run: docker exec live-agent-live-agent-1 python3 -c "import livekit.agents; print(livekit.agents.__version__)"
