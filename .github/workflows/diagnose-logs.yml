name: diagnose fish-speech tts (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: tts container status
        run: docker ps -a --filter "name=live-agent-tts-1" --format "table {{.Names}}\t{{.Status}}"

      - name: tts recent log
        continue-on-error: true
        run: docker logs --tail 100 live-agent-tts-1

      - name: live-agent recent log
        continue-on-error: true
        run: docker logs --tail 60 live-agent-live-agent-1
