name: diagnose tts model download 500 (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: tts full recent log
        continue-on-error: true
        run: docker logs --tail 200 live-agent-tts-1

      - name: models list
        continue-on-error: true
        run: |
          try {
            (Invoke-WebRequest -Uri http://localhost:3906/v1/models -TimeoutSec 15).Content
          } catch {
            Write-Output "FAILED: $($_.Exception.Message)"
          }
