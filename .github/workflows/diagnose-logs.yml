name: diagnose tts base url mismatch (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent container env
        run: docker exec live-agent-live-agent-1 env | Select-String "TTS|STT"

      - name: live-agent .env file on host
        run: Get-Content live-agent/.env

      - name: check for a baked-in .env inside the image
        continue-on-error: true
        run: docker exec live-agent-live-agent-1 find / -maxdepth 3 -iname ".env*" 2>$null
