name: retry tts model download (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: retry download (up to 3 times)
        run: |
          $ok = $false
          for ($i = 0; $i -lt 3; $i++) {
            docker exec live-agent-tts-1 uv tool run speaches-cli model download speaches-ai/piper-ru_RU-ruslan-medium
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Output "attempt $i failed, retrying..."
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { exit 1 }

      - name: models list
        run: (Invoke-WebRequest -Uri http://localhost:3906/v1/models -TimeoutSec 15).Content
