name: diagnose container logs (self-hosted, temporary)

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: live-agent
        continue-on-error: true
        run: docker ps --format "{{.Names}}" | Select-String "live-agent|live_agent" | ForEach-Object { docker logs --tail 150 $_.ToString() }

      - name: container list
        continue-on-error: true
        run: docker ps -a --format "table {{.Names}}\t{{.Status}}"
