name: diagnose large transfer (self-hosted)

# Разовая диагностика: ломается ли ЛЮБАЯ достаточно большая HTTP-передача через внешний
# IP этого раннера (26.67.31.6), или именно Next.js/chunked-стриминг. Поднимает тривиальный
# python http.server с 5MB-файлом на отдельном порту, ждёт, оставляет открытым на 90с,
# чтобы можно было забрать файл снаружи, потом убивает процесс.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Ensure firewall rule for test port 3910
        run: |
          $existing = Get-NetFirewallRule -DisplayName "ainterviewer-diag-3910" -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName "ainterviewer-diag-3910" -Direction Inbound -Protocol TCP -LocalPort 3910 -Action Allow | Out-Null
          }

      - name: Generate 5MB test file and serve it for 90s
        run: |
          $bytes = New-Object byte[] (5MB)
          (New-Object Random).NextBytes($bytes)
          [System.IO.File]::WriteAllBytes("$env:TEMP\testfile.bin", $bytes)
          Set-Location $env:TEMP
          $proc = Start-Process -FilePath python -ArgumentList "-m","http.server","3910" -PassThru -WindowStyle Hidden
          Write-Output "Serving http://26.67.31.6:3910/testfile.bin for 90s (pid $($proc.Id))"
          Start-Sleep -Seconds 90
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Output "done"
