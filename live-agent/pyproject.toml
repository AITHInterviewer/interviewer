[project]
name = "ainterviewer-agent"
version = "0.1.0"
description = "Live-контур ИИ-интервьюера — реактивный граф на LiveKit Agents"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai,silero]~=1.7",
    "claude-agent-sdk",
    "pydantic>=2",
    "python-dotenv",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
