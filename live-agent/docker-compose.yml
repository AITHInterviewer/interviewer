# Live-контур: LLM, STT и TTS через OpenRouter (OpenAI-совместимый API).
# Self-hosted GPU STT/TTS сняты — на VPS нет GPU, веса Fish Speech на Windows-пути
# туда не переезжают. URL и ключи — в .env (см. .env.example), не в environment:
# этот блок имеет приоритет над env_file и уже был причиной ConnectionRefusedError
# (2026-09-06), когда деплой переписывал только .env.

services:
  live-agent:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # ainterviewer-shared — общая сеть с infra/docker-compose.yml (livekit-server, redis,
    # backend). Отдельный compose-проект по умолчанию сидит в своей сети.
    networks:
      default:
      ainterviewer-shared:
    # Реальный деплой — LiveKit-воркер, слушает job'ы по сети (см. Dockerfile, CMD
    # "start"), не привязан к портам.

networks:
  # Создаётся один раз (`docker network create ainterviewer-net`) до `up` обоих
  # compose-проектов — см. infra/docker-compose.yml для объяснения external: true.
  ainterviewer-shared:
    name: ainterviewer-net
    external: true
