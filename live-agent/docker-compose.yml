# STT/TTS как self-hosted OpenAI-совместимые сервисы для ЖИВОГО контура — LiveKit-плагин
# `livekit-plugins-openai` умеет ходить на любой OpenAI-совместимый base_url. LLM сюда
# не входит — он через Claude Agent SDK на подписке (см. src/ainterviewer/llm_client.py).
#
# Проверено вживую (история чата): STT отвечает и держит русский. TTS прошёл через два
# отказа: openedai-speech — нестабилен (падал на XTTS, UnboundLocalError) и без русских
# голосов по умолчанию; Silero (dexogen/silero-tts-api) — сервис рабочий, но веса качаются
# с models.silero.ai, а этот хост ненадёжен независимо у автора и у пользователя (разные
# сети, одна и та же ConnectionRefused/timeout). Остановились на speaches.ai (Piper) —
# голоса лежат на HuggingFace (speaches-ai/piper-ru_RU-*), тот же хост, что уже
# подтверждённо работает для STT. Сравнение альтернатив — README.md, раздел «TTS».
#
# ВАЖНО про модель STT здесь: это ЖИВОЙ контур с бюджетом в единицы секунд — измерили
# вживую, что `large-v3-turbo` на CPU даёт 20–30+ сек/реплику даже прогретым (float16→
# float32 фолбэк без GPU), это и стало причиной "агент перестал отвечать". Большая точная
# модель — законное место evaluation-agent (см. ../evaluation-agent/docker-compose.yml), не сюда.

services:
  live-agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Внутри docker-сети — по имени сервиса, не localhost (тот действует только при
      # локальном запуске .venv-процессом на хосте, см. .env.example).
      - STT_BASE_URL=http://stt:8000/v1
      - TTS_BASE_URL=http://tts:8000/v1
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev-secret-change-me-32-characters
    volumes:
      # Claude Agent SDK запускает `claude` CLI подпроцессом (см. Dockerfile) — креды
      # подписки (`claude login`, разово на хосте, НЕ в образе) читает отсюда.
      # CLAUDE_CONFIG_DIR — путь к `~/.claude` того пользователя, под которым логинились;
      # без переопределения — обычный домашний `~/.claude` (типично для локальной
      # разработки на Linux/Mac).
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/root/.claude:ro
    depends_on:
      - stt
      - tts
    # ainterviewer-shared — общая сеть с infra/docker-compose.yml (livekit-server, redis),
    # отдельный compose-проект по умолчанию сидит в своей сети. Позволяет обращаться к
    # ним по имени сервиса (livekit-server:7880, redis:6379) напрямую, без похода через
    # опубликованные хостовые порты — раньше это было причиной "wait_pc_connection timed
    # out" (см. infra/livekit.yaml). default — иначе теряется связь с stt/tts.
    networks:
      default:
      ainterviewer-shared:
    # Реальный деплой — LiveKit-воркер, слушает job'ы по сети (см. Dockerfile, CMD
    # "start"), не привязан к портам. Не проверено вживую (нужен реальный livekit-server).

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "3905:8000"
    environment:
      # small — быстро, но реальная жалоба на качество техтерминов ("очень плохо").
      # medium — компромисс по точности, ВРЕМЕННО откачен обратно на small (2026-09-05):
      # model.bin для medium (~1.5ГБ) так и не докачался — тот же нестабильный CDN-хост
      # HuggingFace (us.aws.cdn.hf.co), что и с TTS-моделью, тут файл ещё больше и падает
      # ещё стабильнее (blob остался 0-байтным .incomplete). small — тем же путём, что
      # чинили TTS: скачать вручную на другой машине и docker cp в кэш контейнера.
      - WHISPER__MODEL=Systran/faster-whisper-small
      # HF_HUB_OFFLINE=1 — не ходить в сеть за проверкой модели, когда она уже в
      # локальном кэше (актуально после того, как small реально докачается).
      - HF_HUB_OFFLINE=1
    volumes:
      - stt-cache:/root/.cache/huggingface

  tts:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "3906:8000"
    environment:
      # Модель скачивает сам сервер (в ответ на запрос от speaches-cli, не CLI-процесс) —
      # переменная нужна именно тут, `docker exec -e` на отдельный exec-процесс не влияет
      # на уже запущенный сервер. Новый xet-транспорт huggingface_hub падал с TLS handshake
      # eof / CAS service error на этой сети — принудительно классический HTTP-download.
      - HF_HUB_DISABLE_XET=1
      # Дефолтный таймаут huggingface_hub (10с) не хватает на этой сети — реально видели
      # ReadTimeoutError на скачивании model.onnx с us.aws.cdn.hf.co.
      - HF_HUB_DOWNLOAD_TIMEOUT=60
    # Без volume для кэша моделей — реальная проверка показала PermissionError: именованный
    # volume создаётся Docker'ом от root, а образ работает под непривилегированным ubuntu
    # (uid 1000) и не может в него писать. Можно было бы chown'ить volume отдельным init-шагом,
    # но для MVP проще принять, что голос перекачивается заново при пересоздании контейнера —
    # `docker compose stop/start` (без rm) кэш внутри слоя контейнера сохраняет.

volumes:
  stt-cache:

networks:
  # Создаётся один раз (`docker network create ainterviewer-net`) до `up` обоих
  # compose-проектов — см. infra/docker-compose.yml для объяснения external: true.
  ainterviewer-shared:
    name: ainterviewer-net
    external: true
