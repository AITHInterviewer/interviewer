[project]
name = "evaluation-agent"
version = "0.1.0"
description = "Batch-контур ИИ-интервьюера — точный ASR + оценка по рубрике (раздел 5.1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "redis>=5.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
