# Дополнительный оверлей для self-hosted раннера за Radmin VPN — см.
# infra/radmin-workaround/nginx.conf за причиной. Использовать ТОЛЬКО вместе с
# docker-compose.dev.yml (+ infra/docker-compose.yml), не самостоятельно:
#   docker compose -f docker-compose.dev.yml -f infra/docker-compose.yml -f docker-compose.radmin-workaround.yml up -d
#
# Не публикует новый порт вместо 3000 у frontend (тот остаётся как есть — не мешает
# обычной локальной разработке) — слушает 3010, чтобы можно было сравнить оба пути
# бок о бок при диагностике.

services:
  nginx-radmin-workaround:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/radmin-workaround/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3010:80"
    depends_on:
      - frontend
