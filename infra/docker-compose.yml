# Общая инфраструктура, разделяемая несколькими сервисами — НЕ дублируется в
# docker-compose.yml отдельных сервисов. Каждый сервис подключается к этим контейнерам
# по имени (postgres/redis/minio/livekit-server), см. include: в корневом docker-compose.yml.
#
# ВНИМАНИЕ: livekit-server и livekit-egress настроены в dev-режиме с фиксированными
# ключами (devkey/secret) — годится для локальной разработки и CI, НЕ для прода. Egress
# ни разу не проверялся вживую (нет реальной WebRTC-комнаты с записью в этом проекте
# на момент написания) — конфиг собран по документации LiveKit, не протестирован.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ainterviewer
      - POSTGRES_PASSWORD=ainterviewer
      - POSTGRES_DB=ainterviewer
    ports:
      - "3901:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainterviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "3902:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ainterviewer-shared — чтобы live-agent (отдельный compose-проект/сеть, см.
    # live-agent/docker-compose.yml) мог достучаться по имени сервиса "redis", не через
    # хостовый порт. default нужно перечислить явно — явный список networks: на сервисе
    # заменяет неявное членство в default, а не дополняет его.
    networks:
      default:
      ainterviewer-shared:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=ainterviewer
      - MINIO_ROOT_PASSWORD=ainterviewer123
    ports:
      - "3903:9000" # S3 API
      - "3904:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit-server:
    image: livekit/livekit-server:latest
    # Полный конфиг вместо --dev — см. livekit.yaml (там же объяснение use_external_ip
    # и почему ручной --node-ip не решал проблему ICE между live-agent и этим сервером).
    command: --config /etc/livekit.yaml
    # ./infra/livekit.yaml, не ./livekit.yaml: этот compose-файл всегда запускается как
    # `docker compose --project-directory . -f infra/docker-compose.yml ...` (из корня
    # репо, см. деплой-workflow) — относительные пути в volumes резолвятся от
    # --project-directory, НЕ от папки самого этого файла. С `./livekit.yaml` Docker не
    # находил файл в корне репо и молча монтировал пустую директорию вместо файла
    # ("read /etc/livekit.yaml: is a directory", livekit-server не стартовал).
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
      # Тот же сертификат, что и у nginx (см. сервис acme выше) — используется только
      # деплойной версией livekit.yaml (turn: cert_file/key_file), локальный дефолт
      # TURN вообще не включает. Пустая директория локально — не проблема, раз на неё
      # никто не ссылается.
      - ./infra/tls:/etc/ainterviewer-tls:ro
    ports:
      - "3907:7880" # HTTP/WS сигналинг
      - "3908:7881" # TCP fallback для ICE/TURN
      - "50000-50100:50000-50100/udp" # RTC-медиа (диапазон урезан для локали; в проде — шире)
      - "5349:5349" # встроенный TURN/TLS (см. livekit.yaml, блок turn) — обход для candidate без VPN
    # ainterviewer-shared — чтобы live-agent (отдельный compose-проект/сеть) видел этот
    # контейнер напрямую по имени "livekit-server" и получал host ICE-кандидат вместо
    # похода через внешний IP хоста (см. livekit.yaml). default — иначе теряется связь
    # с backend/frontend внутри основного проекта (явный networks: заменяет default, не
    # дополняет).
    networks:
      default:
      ainterviewer-shared:

  # Единая точка входа наружу (frontend/backend/livekit-сигналинг за одним портом) —
  # см. infra/nginx/nginx.conf, там же — почему postgres/minio сюда не заведены и почему
  # апстримы резолвятся в рантайме, а не через depends_on: frontend/backend определены в
  # docker-compose.dev.yml (не в этом файле) — по имени резолвятся, только когда оба
  # compose-файла подняты вместе одним проектом (см. .github/workflows/deploy-full.yml).
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Настоящий Let's Encrypt сертификат (через DuckDNS DNS-01, без открытых портов
      # 80/443 — см. сервис acme ниже и .github/workflows/deploy-full.yml). ./infra/tls
      # должен существовать до старта nginx: ssl_certificate указывает на него напрямую,
      # отсутствие файла — фатальная ошибка старта nginx, не просто 502 на один location.
      - ./infra/tls:/etc/ainterviewer-tls:ro
    ports:
      - "${PUBLIC_HTTP_PORT:-12345}:443"

  # Одноразовая (не поднимается через `up -d`, только `docker compose run --rm acme` —
  # см. deploy-full.yml) выписка/продление Let's Encrypt сертификата через DNS-01 у DuckDNS:
  # не требует открытых портов 80/443 (которые нельзя открыть на этом туннеле, только ≥1000)
  # — вместо HTTP-проверки CA сверяет TXT-запись, которую acme.sh сам проставляет через
  # DuckDNS API. Сертификат общий для nginx (сайт) и livekit-server (TURN/TLS, см.
  # infra/livekit.yaml) — оба читают один и тот же ./infra/tls.
  acme:
    image: neilpang/acme.sh
    # Без ":?required" — Compose интерполирует ВЕСЬ файл, включая этот сервис, даже когда
    # `up`/`down` нацелены на другие сервисы и эти переменные не заданы в их шагах (env
    # одного шага workflow не переживает переход к следующему) — с required-синтаксисом
    # любой такой вызов падал с "required variable ... is missing a value", хотя acme
    # вообще не запускался. Пустые значения здесь безвредны: acme.sh сам явно сообщит об
    # ошибке, если его действительно запустят (см. deploy-full.yml) без DUCKDNS_TOKEN/TLS_DOMAIN.
    environment:
      - DuckDNS_Token=${DUCKDNS_TOKEN}
    volumes:
      - ./infra/tls:/acme.sh/output
    entrypoint: sh
    command: >-
      -c "acme.sh --issue --dns dns_duckdns -d ${TLS_DOMAIN} --server letsencrypt --cert-home /acme.sh/output &&
      acme.sh --install-cert -d ${TLS_DOMAIN} --cert-home /acme.sh/output --key-file /acme.sh/output/domain.key --fullchain-file /acme.sh/output/fullchain.pem"

  livekit-egress:
    image: livekit/egress:latest
    environment:
      - EGRESS_CONFIG_BODY=${EGRESS_CONFIG_BODY:-}
    volumes:
      - ./livekit-egress-config.yaml:/etc/egress.yaml:ro
    command: ["--config", "/etc/egress.yaml"]
    depends_on:
      - redis
      - livekit-server

volumes:
  postgres-data:
  minio-data:

networks:
  # Общая сеть между этим compose-проектом и live-agent/docker-compose.yml (отдельный
  # проект — своя сеть по умолчанию). external: true — сеть создаётся один раз явной
  # командой `docker network create` до `up` обоих проектов (см. деплой-workflow), а не
  # компоузом здесь: если оба compose-файла управляют одноимённой сетью без external,
  # второй `up` падает с "network already exists".
  ainterviewer-shared:
    name: ainterviewer-net
    external: true
