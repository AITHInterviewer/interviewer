# Общая инфраструктура, разделяемая несколькими сервисами — НЕ дублируется в
# docker-compose.yml отдельных сервисов. Каждый сервис подключается к этим контейнерам
# по имени (postgres/redis/minio/livekit-server), см. include: в корневом docker-compose.yml.
#
# ВНИМАНИЕ: livekit-server и livekit-egress настроены в dev-режиме с фиксированными
# ключом devkey и секретом только для разработки — годится для локальной разработки и CI,
# НЕ для прода. Egress
# ни разу не проверялся вживую (нет реальной WebRTC-комнаты с записью в этом проекте
# на момент написания) — конфиг собран по документации LiveKit, не протестирован.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ainterviewer
      - POSTGRES_PASSWORD=ainterviewer
      - POSTGRES_DB=ainterviewer
    ports:
      - "3901:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainterviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "3902:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ainterviewer-shared — чтобы live-agent (отдельный compose-проект/сеть, см.
    # live-agent/docker-compose.yml) мог достучаться по имени сервиса "redis", не через
    # хостовый порт. default нужно перечислить явно — явный список networks: на сервисе
    # заменяет неявное членство в default, а не дополняет его.
    networks:
      default:
      ainterviewer-shared:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=ainterviewer
      - MINIO_ROOT_PASSWORD=ainterviewer123
    ports:
      - "3903:9000" # S3 API
      - "3904:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit-server:
    image: livekit/livekit-server:latest
    # Полный конфиг вместо --dev — см. livekit.yaml (там же объяснение use_external_ip
    # и почему ручной --node-ip не решал проблему ICE между live-agent и этим сервером).
    command: --config /etc/livekit.yaml
    # Relative to this included compose file. Keeping the path local also works when the
    # root compose stack includes infra/docker-compose.yml.
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "3907:7880" # HTTP/WS сигналинг
      - "3908:7881" # TCP fallback для ICE/TURN
      - "50000-50100:50000-50100/udp" # RTC-медиа (диапазон урезан для локали; в проде — шире)
    # ainterviewer-shared — чтобы live-agent (отдельный compose-проект/сеть) видел этот
    # контейнер напрямую по имени "livekit-server" и получал host ICE-кандидат вместо
    # похода через внешний IP хоста (см. livekit.yaml). default — иначе теряется связь
    # с backend/frontend внутри основного проекта (явный networks: заменяет default, не
    # дополняет).
    networks:
      default:
      ainterviewer-shared:

  livekit-egress:
    image: livekit/egress:latest
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./livekit-egress-config.yaml:/etc/egress.yaml:ro
    depends_on:
      - redis
      - livekit-server

volumes:
  postgres-data:
  minio-data:

networks:
  # Общая сеть между этим compose-проектом и live-agent/docker-compose.yml (отдельный
  # проект — своя сеть по умолчанию). external: true — сеть создаётся один раз явной
  # командой `docker network create` до `up` обоих проектов (см. деплой-workflow), а не
  # компоузом здесь: если оба compose-файла управляют одноимённой сетью без external,
  # второй `up` падает с "network already exists".
  ainterviewer-shared:
    name: ainterviewer-net
    external: true
