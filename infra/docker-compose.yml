# Общая инфраструктура, разделяемая несколькими сервисами — НЕ дублируется в
# docker-compose.yml отдельных сервисов. Каждый сервис подключается к этим контейнерам
# по имени (postgres/redis/minio/livekit-server), см. include: в корневом docker-compose.yml.
#
# ВНИМАНИЕ: livekit-server и livekit-egress настроены в dev-режиме с фиксированными
# ключами (devkey/secret) — годится для локальной разработки и CI, НЕ для прода. Egress
# ни разу не проверялся вживую (нет реальной WebRTC-комнаты с записью в этом проекте
# на момент написания) — конфиг собран по документации LiveKit, не протестирован.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ainterviewer
      - POSTGRES_PASSWORD=ainterviewer
      - POSTGRES_DB=ainterviewer
    ports:
      - "3901:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainterviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "3902:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=ainterviewer
      - MINIO_ROOT_PASSWORD=ainterviewer123
    ports:
      - "3903:9000" # S3 API
      - "3904:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit-server:
    image: livekit/livekit-server:latest
    # --node-ip — какой IP livekit-server объявляет ICE-кандидатам как адрес для медиа
    # (WebRTC/RTP), НЕ то же самое, что сигнальный WS (порт 3907, который просто
    # port-forward и работает всегда). В --dev режиме livekit-server по умолчанию
    # объявляет собственный внутренний Docker-адрес (например 172.19.0.5) — недостижим
    # ни снаружи (браузер кандидата), ни из другого docker-compose проекта (live-agent,
    # отдельная сеть) — сигнализация подключается, а сама аудио/видео-передача зависает
    # без единой ошибки в логах. LIVEKIT_NODE_IP пустой по умолчанию (для обычной
    # локальной разработки — там livekit-server и клиент на одной машине, эта проблема
    # не возникает); деплой-workflow задаёт его в LIVEKIT_NODE_IP явно.
    command: --dev --bind 0.0.0.0 ${LIVEKIT_NODE_IP:+--node-ip=${LIVEKIT_NODE_IP}}
    ports:
      - "3907:7880" # HTTP/WS сигналинг
      - "3908:7881" # TCP fallback для ICE/TURN
      - "50000-50100:50000-50100/udp" # RTC-медиа (диапазон урезан для локали; в проде — шире)
    environment:
      - "LIVEKIT_KEYS=devkey: secret" # YAML: без кавычек двоеточие в значении ломает парсинг (нашла на docker compose config)

  livekit-egress:
    image: livekit/egress:latest
    environment:
      - EGRESS_CONFIG_BODY=${EGRESS_CONFIG_BODY:-}
    volumes:
      - ./livekit-egress-config.yaml:/etc/egress.yaml:ro
    command: ["--config", "/etc/egress.yaml"]
    depends_on:
      - redis
      - livekit-server

volumes:
  postgres-data:
  minio-data:
