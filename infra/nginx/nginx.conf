# Единая точка входа для деплоя на self-hosted раннере (см. infra/README.md и
# .github/workflows/deploy-full.yml) — вместо прямого доступа по IP:порт к каждому
# сервису отдельно (frontend:3000, backend:8000, livekit-server:3907) снаружи виден
# только этот nginx на одном порту.
#
# HTTP-only (без TLS) — сознательно отложено, см. обсуждение в задаче. Без HTTPS браузер
# не выдаст сайту доступ к камере/микрофону для не-localhost origin — это ограничение
# самого браузера (secure context), нужно будет вернуться к TLS до реального созвона.
#
# postgres и minio сюда намеренно не выведены: postgres — не HTTP-протокол, наружу его
# отдавать незачем и небезопасно; minio (S3 API + консоль) уже работает на своих портах
# (3903/3904, см. infra/README.md) — веб-консоль MinIO сама не готова отдаваться из-под
# префикса (шлёт абсолютные пути ассетов), заворачивать её сюда без доп. настройки
# (MINIO_BROWSER_REDIRECT_URL) значило бы сломать консоль ради того, что и так уже
# доступно напрямую.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # 127.0.0.11 — встроенный DNS докер-сети. Апстримы ниже проксируются через
    # переменные (не голым hostname в proxy_pass), чтобы nginx резолвил их на КАЖДЫЙ
    # запрос, а не один раз при старте: livekit-server на этом раннере сейчас вообще не
    # поднимается этим workflow (см. deploy-full.yml, обход бага Docker Desktop с UDP-
    # диапазоном) — со статическим резолвингом отсутствие ЛЮБОГО из трёх сервисов при
    # старте не даёт nginx'у запуститься вообще ("host not found in upstream"), роняя
    # заодно и остальные, рабочие, маршруты. Так — просто 502 на конкретном location,
    # пока соответствующий сервис не поднят.
    resolver 127.0.0.11 valid=10s;

    # backend — REST API и control-канал (WS), все пути уже начинаются с /api
    # (см. app/routers/*.py) — префикс не срезаем, проксируем как есть.
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # livekit-server — WS-сигналинг для звонка кандидат↔live-agent. Клиентский SDK сам
    # достраивает путь к базовому URL (livekit-client: createRtcUrl → "<base>/rtc/v1",
    # createValidateUrl → "<base>/rtc/v1/validate") — префикс /rtc/ проксируем без
    # изменения пути, чтобы совпасть с тем, что реально шлёт браузер.
    location /rtc/ {
        set $livekit_upstream livekit-server:7880;
        proxy_pass http://$livekit_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # frontend (Next.js) — всё остальное, включая его собственный dev-HMR WebSocket.
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
