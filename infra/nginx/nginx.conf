# Единая точка входа для деплоя на Linux VPS (см. infra/README.md и
# .github/workflows/deploy-full.yml). Снаружи хостовый порт 12345 проброшен на 443
# контейнера (хостовые 80/443 заняты чужим nginx). LiveKit — свои порты (7881/5349/UDP).
#
# HTTPS обязателен не только для камеры/микрофона (secure context) — TURN/TLS для медиа
# (см. infra/livekit.yaml) переиспользует этот же сертификат, поэтому сайт тоже на TLS.
# Сертификат настоящий (Let's Encrypt / ZeroSSL / BuyPass через DNS-01 DuckDNS, см.
# сервис acme в infra/docker-compose.yml).
#
# listen 80 внутри контейнера не проброшен наружу; редирект на :12345 на случай
# внутреннего обращения. На 443 маршруты не меняем.
#
# postgres сюда намеренно не выведен: не HTTP-протокол, наружу незачем.
# MinIO S3 API — location /s3/ ниже (консоль MinIO за префиксом не отдаём).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host:12345$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # см. сервис acme в infra/docker-compose.yml — общий с TURN/TLS livekit-server
    # сертификат, оба читают один и тот же ./infra/tls.
    ssl_certificate /etc/ainterviewer-tls/fullchain.pem;
    ssl_certificate_key /etc/ainterviewer-tls/domain.key;

    # 127.0.0.11 — встроенный DNS докер-сети. Апстримы ниже проксируются через
    # переменные (не голым hostname в proxy_pass), чтобы nginx резолвил их на КАЖДЫЙ
    # запрос, а не один раз при старте: отсутствие ЛЮБОГО из сервисов при старте не
    # даёт nginx'у запуститься вообще ("host not found in upstream"). Так — просто
    # 502 на конкретном location, пока соответствующий сервис не поднят.
    resolver 127.0.0.11 valid=10s;

    # backend — REST API и control-канал (WS), все пути уже начинаются с /api
    # (см. app/routers/*.py) — префикс не срезаем, проксируем как есть.
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / ReDoc — FastAPI отдаёт их сам в корне (docs_url/redoc_url не
    # переопределены в app/main.py), а не под /api; сами страницы Swagger UI/ReDoc
    # подгружают JS/CSS с CDN, не с backend, так что больше путей сюда добавлять не нужно.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # livekit-server — WS-сигналинг для звонка кандидат↔live-agent. Клиентский SDK сам
    # достраивает путь к базовому URL (livekit-client: createRtcUrl → "<base>/rtc/v1",
    # createValidateUrl → "<base>/rtc/v1/validate") — префикс /rtc/ проксируем без
    # изменения пути, чтобы совпасть с тем, что реально шлёт браузер.
    location /rtc/ {
        set $livekit_upstream livekit-server:7880;
        proxy_pass http://$livekit_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO S3 API за префиксом /s3/. proxy_pass с переменной не срезает URI сам
    # (в отличие от `proxy_pass http://minio:9000/;`) — срез через rewrite.
    location /s3/ {
        set $minio_upstream minio:9000;
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;

        client_max_body_size 512m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # frontend (Next.js) — всё остальное, включая его собственный HMR WebSocket (dev).
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
