# Локальный дефолт (одна машина, без внешнего IP/VPN-разводки) — livekit-server и
# клиент на одном хосте, доп. настройка ICE не нужна. Для деплоя на раннер за Radmin VPN
# этот файл ПЕРЕЗАПИСЫВАЕТСЯ workflow'ом (см. .github/workflows/deploy-full.yml,
# шаг "Write infra/livekit.yaml") — там добавляется rtc.node_ip с адресом VPN-интерфейса.
#
# Почему не use_external_ip: true (STUN-автоопределение) — попробовали и откатили: STUN
# нашёл РЕАЛЬНЫЙ публичный IP хоста (через интернет-аплинк), а не адрес Radmin VPN, через
# который реально ходит браузер кандидата — это две разные сети, ICE-кандидат с
# STUN-адресом был бы недостижим для VPN-клиентов. См. коммит с этим комментарием.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
keys:
  devkey: secret
room:
  auto_create: true
# Обязательно для Egress: livekit-server раздаёт start/stop room-composite запросы
# зарегистрированным egress-воркерам через Redis, не напрямую — без этого блока запрос
# на запись уходит в никуда (сам livekit-server отвечает 200 на /twirp, но egress его
# никогда не получает), egress-контейнер при этом тоже требует свой redis: в
# livekit-egress-config.yaml (тот же адрес).
redis:
  address: redis:6379

# Встроенный TURN/TLS (обходной путь для медиа, когда candidate без Radmin VPN идёт через
# внешний туннель) добавляется ТОЛЬКО в версии, которую пишет deploy-full.yml — там есть
# настоящий TLS-сертификат (Let's Encrypt через DuckDNS DNS-01, см. workflow). Здесь, в
# локальном дефолте, файлов сертификата нет — добавлять turn: с несуществующим cert_file
# уронит livekit-server при обычном локальном запуске.
