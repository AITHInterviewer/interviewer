# Заменяет --dev режим livekit-server. --dev объявляет клиентам собственный внутренний
# Docker-адрес контейнера как единственный ICE-кандидат для медиа (WebRTC/RTP) — недостижим
# ни снаружи (браузер кандидата), ни из другого docker-compose проекта (live-agent).
# Ручной форс одного внешнего IP (--node-ip) чинил это только частично: ВСЕ клиенты
# (включая live-agent, который на этой же машине и мог бы ходить напрямую) вынуждены
# были стучаться на внешний IP хоста — на практике WebRTC/ICE так и не устанавливался
# ("wait_pc_connection timed out"), хотя обычный TCP-connect и UDP-sendto на этот адрес
# проходили (см. диагностику 2026-09-04).
#
# use_external_ip: true — штатный механизм LiveKit: сервер сам через STUN определяет
# публичный (srflx) адрес И параллельно объявляет внутренний (host) кандидат. ICE тогда
# перебирает пары кандидатов сам: браузер кандидата (снаружи) успешно соединяется через
# srflx-адрес, а live-agent (та же машина, общая docker-сеть ainterviewer-net, см.
# docker-compose.yml) — напрямую через host-кандидат, без похода через внешний IP хоста.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  devkey: secret
room:
  auto_create: true
