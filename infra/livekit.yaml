# Локальный дефолт (одна машина, без внешнего IP) — livekit-server и клиент на одном
# хосте, доп. настройка ICE не нужна. Для деплоя на VPS этот файл ПЕРЕЗАПИСЫВАЕТСЯ
# workflow'ом (см. .github/workflows/deploy-full.yml, шаг "Write infra/livekit.yaml") —
# там rtc.node_ip = публичный IP машины, turn.domain = TLS_DOMAIN.
#
# На VPS ручной node_ip достаточный, use_external_ip не включаем.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
keys:
  devkey: dev-secret-change-me-32-characters
room:
  auto_create: true
# Обязательно для Egress: livekit-server раздаёт start/stop room-composite запросы
# зарегистрированным egress-воркерам через Redis, не напрямую — без этого блока запрос
# на запись уходит в никуда (сам livekit-server отвечает 200 на /twirp, но egress его
# никогда не получает), egress-контейнер при этом тоже требует свой redis: в
# livekit-egress-config.yaml (тот же адрес).
redis:
  address: redis:6379

# Встроенный TURN/TLS добавляется ТОЛЬКО в версии, которую пишет deploy-full.yml —
# там есть сертификат. Здесь, в локальном дефолте, файлов сертификата нет —
# добавлять turn: с несуществующим cert_file уронит livekit-server при обычном
# локальном запуске.
