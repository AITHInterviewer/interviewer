# Конфиг livekit-egress. Триггерится теперь реально: `backend/app/services/livekit_egress.py`
# вызывает Room Composite Egress API при выдаче первого LiveKit-токена кандидату (см.
# `candidate_interview.py`) и останавливает запись на `interview_completed` (см.
# `interview_event_service.py`). Собран по официальной документации LiveKit:
# https://docs.livekit.io/home/egress/overview/
#
# api_key/api_secret совпадают с dev-ключами livekit-server (LIVEKIT_KEYS=devkey: secret).
api_key: devkey
api_secret: secret
ws_url: ws://livekit-server:7880

# Обязательно: egress получает start/stop-запросы не напрямую (backend зовёт только
# livekit-server API), а через тот же Redis, что и livekit-server — без этого блока
# сервис не может зарегистрироваться и падает сразу при старте с "missing config"
# (найдено на деплое 2026-09-06). Тот же Redis-сервис, что в этом же compose-проекте.
redis:
  address: redis:6379

# Куда пишутся записи комнат — S3-совместимое хранилище (MinIO из этого же compose).
# Egress конфигурируется на уровне рум-composite/track-запросов через API при создании
# комнаты (см. раздел "Как реально пишется запись" в docs/Архитектура и дизайн MVP.md) —
# этот файл задаёт только дефолтный output-target для egress-сервиса.
s3:
  access_key: ainterviewer
  secret: ainterviewer123
  bucket: ainterviewer-recordings
  endpoint: http://minio:9000
  force_path_style: true
  region: us-east-1

# Бакет ainterviewer-recordings создавать руками не нужно — livekit_egress.py сам делает
# head_bucket/create_bucket перед стартом записи (тот же паттерн, что storage.py::upload_resume
# для бакета резюме), т.к. ни egress, ни этот конфиг сами бакет не создают.
