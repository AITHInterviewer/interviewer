# Обходной прокси перед frontend (specs/004-candidate-interview-flow, диагностика
# 2026-09-04) — только для self-hosted раннера за Radmin VPN, где что-то на сетевом
# пути ломает Transfer-Encoding: chunked (Next.js SSR-стриминг) и WebSocket-апгрейд
# (HMR), при этом обычный HTTP с Content-Length того же и большего размера проходит
# без проблем (проверено 5MB-файлом через python http.server). chunked_transfer_encoding
# off заставляет nginx полностью буферизовать ответ upstream'а и переотдать его клиенту
# уже с Content-Length, а не chunked.
#
# НЕ часть обычного локального docker-compose.dev.yml — тот работает нормально без
# этого прокси у всех остальных, кому не мешает конкретно эта сеть.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        chunked_transfer_encoding off;
        proxy_buffering on;
        proxy_read_timeout 90s;
    }
}
