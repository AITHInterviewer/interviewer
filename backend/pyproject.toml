[project]
name = "ainterviewer-backend"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for AInterviewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "celery[redis]",
    "boto3",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
