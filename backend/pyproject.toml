[project]
name = "ainterviewer-backend"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for AInterviewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "celery[redis]",
    "boto3",
    # redis>=5 уже тянется транзитивно через celery[redis], но объявляем явно — backend
    # использует его напрямую (redis.asyncio) для control-канала кандидата
    # (specs/004-candidate-interview-flow), не только как Celery-брокер.
    "redis>=5.0",
    # Выпуск access token для LiveKit room (specs/004-candidate-interview-flow,
    # contracts/livekit-token.md) — backend подписывает токен, secret никогда не уходит
    # на frontend.
    "livekit-api>=0.7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
