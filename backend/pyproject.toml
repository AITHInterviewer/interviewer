[project]
name = "ainterviewer-backend"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for AInterviewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "celery[redis]",
    "boto3",
    # redis>=5 уже тянется транзитивно через celery[redis], но объявляем явно — backend
    # использует его напрямую (redis.asyncio) для control-канала кандидата
    # (specs/004-candidate-interview-flow), не только как Celery-брокер.
    "redis>=5.0",
    # Выпуск access token для LiveKit room (specs/004-candidate-interview-flow,
    # contracts/livekit-token.md) — backend подписывает токен, secret никогда не уходит
    # на frontend.
    "livekit-api>=0.7",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    # Генерация базовых вопросов вакансии (app/services/vacancy_llm_service.py) — Claude
    # Agent SDK на подписке (claude login), не Anthropic API-ключ. Не пиним версию — тот
    # же подход, что live-agent/pyproject.toml.
    "claude-agent-sdk",
    # Multipart-эндпоинт создания интервью (POST /vacancies/{id}/interviews, resume_file) —
    # FastAPI требует этот пакет для разбора form-data/UploadFile.
    "python-multipart",
    # HTTP-клиент для OpenRouter (app/services/llm.py). В optional-dev он уже был
    # из‑за тестов; в production-образе (`uv sync --no-dev`) его не было — uvicorn
    # падал с ModuleNotFoundError: httpx.
    "httpx>=0.27",
    # Текст из PDF с описанием вакансии (app/services/document_text.py). Файл не храним,
    # только достаём текст для извлечения требований.
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
    # Тестовая БД (tests/conftest.py) — SQLite в памяти, т.к. реальный Postgres недоступен
    # в песочнице, где писался код; на боевой asyncpg-DSN (DATABASE_URL) не влияет.
    "aiosqlite>=0.20",
    # Тестовый Redis (tests/test_interview_ws.py) — реальный Redis недоступен в песочнице,
    # где писался код; на боевой REDIS_URL не влияет.
    "fakeredis>=2.30",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
